<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作水池</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#E9F2F8; --ink2:#C9D8E1; --mute:#9DB3C0; --line:#2C4554; --line2:#1D303C;
  --bg:#0A0F17; --card:#0F1B26; --card2:#0B1620; --deep:#0D1822; --deep2:#14303D; --ice:#163541;
  --accent:#67E8F9; --accent2:#78DCE6; --aurora:#5EEAD4; --danger:#FF6B6B; --warn:#F5C46B; --ok:#7EE2B8;
  --t-proj:#8AB4FF; --t-proj-bg:#16264A;
  --t-sec:#FF8BA0;  --t-sec-bg:#3D1622;
  --t-rec:#5EE6C6;  --t-rec-bg:#0E3530;
  --t-rel:#C4A3FF;  --t-rel-bg:#2A1D4A;
  --t-rep:#FFAB6B;  --t-rep-bg:#3F2412;
  --r:12px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 0%,rgba(17,49,67,.55),transparent 45%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid #3A5D6A;background:#142B37;color:#CDEFF3;border-radius:8px;padding:7px 14px;font-weight:500}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#06202A;font-weight:700}
button.primary:hover:not(:disabled){background:#A6F1F3}
button.ghost{border-color:transparent;background:transparent}
button.danger{border-color:#7A3A3F;background:#2A1418;color:#FFB4B4}
button.sm{padding:4px 11px;font-size:14px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--card2);min-width:0}
input::placeholder,textarea::placeholder{color:#7F97A4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(103,232,249,.16)}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.85)}
textarea{width:100%;resize:vertical;line-height:1.6}
a{color:var(--accent)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px}
.eyebrow{font:500 12px "JetBrains Mono",ui-monospace,monospace;letter-spacing:.16em;color:#7FD3DE}
.eyebrow span{color:#4F8592}
/* layout */
.app{display:flex;min-height:100vh;position:relative}
.sidebar{position:sticky;top:0;height:100vh;width:264px;flex-shrink:0;z-index:30;display:flex;flex-direction:column;background:rgba(16,25,35,.96);border-right:1px solid #263B4B}
.brand{padding:22px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #263745}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid #3B8797;background:#163540;border-radius:10px;color:var(--accent)}
.brand strong{display:block;font-size:18px;letter-spacing:.12em}
.brand small{display:block;color:#8FA9B8;font:11px "JetBrains Mono",monospace;letter-spacing:.08em;margin-top:2px}
.side{padding:20px 14px;overflow-y:auto;flex:1}
#nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
#nav button{width:100%;display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:9px;padding:10px 12px;background:none;text-align:left;color:#B4C6D0}
#nav button b{display:block;font-size:16px;font-weight:500}
#nav button small{display:block;font:11px "JetBrains Mono",monospace;letter-spacing:.08em;color:#8199A6;margin-top:1px}
#nav button em{font:13px "JetBrains Mono",monospace;font-style:normal;color:#6F8D9A;width:22px}
#nav button:hover{background:#13293480;border-color:#2E4C59}
#nav button.on{border-color:#3C869B;background:#12323F;color:#E2FBFD}
#nav button.on em{color:var(--accent)}
.snap{margin:14px;border:1px solid #2A4350;border-radius:10px;padding:14px 15px;background:#0D1822}
.snap .r{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;color:#B4C6D0;font-size:15px}
.snap .r b{color:#DDF8FA;font:600 18px "JetBrains Mono",monospace}
.snap .r b.hot{color:var(--t-rep)}
.side-foot{padding:12px 14px 18px;border-top:1px solid #263745;display:flex;flex-direction:column;gap:8px}
.side-foot .row{gap:8px}
.main{flex:1;min-width:0;padding:26px clamp(16px,2.6vw,40px) 40px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:28px;letter-spacing:.04em;margin:6px 0 2px;font-weight:700}
.top p{margin:0;color:var(--mute);font-size:15px}
.hero{border:1px solid #294753;border-radius:14px;min-height:150px;background-size:cover;background-position:center 60%;padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px;overflow:hidden}
.hero h2{font-size:24px;letter-spacing:.04em;margin:8px 0 4px}
.hero p{margin:0;color:#C3D6DF;font-size:15px}
.hero .big{text-align:right}
.hero .big b{display:block;font:700 34px "JetBrains Mono",monospace;color:#E3FCFF;line-height:1.1}
.hero .big span{font:12px "JetBrains Mono",monospace;letter-spacing:.14em;color:#A5CBD4}
@media (max-width:980px){
  .app{display:block}
  .sidebar{position:relative;height:auto;width:auto;border-right:none;border-bottom:1px solid #263B4B;background:#101923}
  .brand{padding:12px 16px}
  .side{padding:0 10px 8px;overflow:visible}
  .side .eyebrow,.snap{display:none}
  #nav{flex-direction:row;overflow-x:auto;margin:0}
  #nav button{width:auto;white-space:nowrap;padding:6px 12px}
  #nav button small,#nav button em{display:none}
  .side-foot{flex-direction:row;flex-wrap:wrap;border-top:none;padding:0 14px 10px}
  .hero .big{display:none}
}
/* common */
.panel{background:rgba(16,28,39,.88);border:1px solid #273C4B;border-radius:var(--r);padding:17px 19px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid #3A5D6A;border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 13px;background:#0F222C}
.seg button.on{background:var(--accent2);color:#06202A;font-weight:700}
.label{font-size:14px;color:var(--mute);font-weight:500}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:4px 11px;font-size:14px;font-weight:500;white-space:nowrap;border:1px solid}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.demo{border-color:#6A583A;color:#F2D9A4;background:#2D2615}
.pill.live{border-color:#32685F;color:#A3E3CA;background:#10281F}
.pill.stale{border-color:#6A583A;color:#F2D9A4;background:#2D2615}
.pill.fresh{border-color:#2F5B6A;color:#BFEAF0;background:#0F2530}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700;line-height:23px;white-space:nowrap;border:1px solid}
.T-專案{color:var(--t-proj);background:var(--t-proj-bg);border-color:#2E4A86}
.T-資安專案{color:var(--t-sec);background:var(--t-sec-bg);border-color:#7A2E40}
.T-定期事項{color:var(--t-rec);background:var(--t-rec-bg);border-color:#1E6B5C}
.T-Release{color:var(--t-rel);background:var(--t-rel-bg);border-color:#54388F}
.T-維修單{color:var(--t-rep);background:var(--t-rep-bg);border-color:#80461F}
.st{display:inline-block;border-radius:6px;padding:0 8px;font-size:13px;font-weight:500;line-height:23px;border:1px solid #3A5260;color:var(--ink2);background:#132430;white-space:nowrap}
.st.done{background:#123A2C;border-color:#2F7A5C;color:var(--ok)}
.st.wait{background:#3A2D12;border-color:#7A6030;color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;align-items:center}
/* timeline */
.tl{position:relative;overflow-x:auto;border:1px solid #273C4B;border-radius:var(--r);background:var(--card)}
.tl-inner{min-width:900px;position:relative}
.tl-head{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);background:#0D1922;position:sticky;top:0}
.tl-scale{position:relative;height:46px}
.tl-tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:13px;color:var(--ink2);padding:2px 5px;white-space:nowrap;font-weight:500}
.tl-tick.minor{border-left:1px dashed var(--line2);color:var(--mute);font-weight:400;top:23px;height:23px}
.tl-lane{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line2)}
.tl-lname{padding:9px 11px;font-weight:700;font-size:15px;border-right:1px solid var(--line);background:#0D1922}
.tl-track{position:relative;padding:6px 0}
.tl-row{position:relative;height:31px}
.tl-bar{position:absolute;top:3px;height:25px;border-radius:6px;font-size:14px;font-weight:500;line-height:23px;padding:0 8px;white-space:nowrap;cursor:pointer;border:1.5px solid;overflow:visible}
.tl-bar:hover{box-shadow:0 0 14px rgba(103,232,249,.25)}
.tl-bar.done{opacity:.5}
.tl-dot{position:absolute;top:7px;width:17px;height:17px;border-radius:50%;border:3px solid;background:var(--card);cursor:pointer}
.tl-dia{position:absolute;top:7px;width:16px;height:16px;transform:rotate(45deg);border:3px solid;cursor:pointer}
.tl-lbl{position:absolute;top:3px;font-size:14px;line-height:25px;white-space:nowrap;color:var(--ink);font-weight:500;cursor:pointer}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);pointer-events:none}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--danger);pointer-events:none;z-index:3;box-shadow:0 0 10px rgba(255,107,107,.5)}
.tl-todaylbl{position:absolute;bottom:2px;transform:translateX(-50%);background:var(--danger);color:#1A0606;font-size:12px;padding:0 6px;border-radius:4px;font-weight:700;z-index:2;white-space:nowrap}
.c-專案{--c:var(--t-proj);--cb:var(--t-proj-bg)}
.c-資安專案{--c:var(--t-sec);--cb:var(--t-sec-bg)}
.c-定期事項{--c:var(--t-rec);--cb:var(--t-rec-bg)}
.c-Release{--c:var(--t-rel);--cb:var(--t-rel-bg)}
.c-維修單{--c:var(--t-rep);--cb:var(--t-rep-bg)}
.tl-bar{color:var(--c);background:var(--cb);border-color:var(--c)}
.tl-dot{border-color:var(--c)}
.tl-dia{border-color:var(--c);background:var(--cb)}
/* pool */
.pool-wrap{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.pool-wrap{grid-template-columns:1fr}}
.lib{max-height:calc(100vh - 300px);overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}
.grip{display:inline-grid;grid-template-columns:repeat(2,4px);gap:3px;padding:4px 2px;cursor:grab;flex:none;margin-top:3px}
.grip i{width:4px;height:4px;border-radius:50%;background:#6D8794}
.mini{border:1px solid #30424D;border-left:4px solid var(--c);border-radius:9px;padding:10px 11px;background:rgba(12,23,33,.9);cursor:grab;display:flex;gap:9px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.mini:hover{border-color:#4D8291;border-left-color:var(--c);box-shadow:0 0 22px rgba(34,211,238,.08)}
.mini:hover .grip i{background:var(--accent)}
.mini .t{font-weight:500;font-size:15px;line-height:1.5}
.mini .m{font-size:13px;color:var(--mute);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini.in{opacity:.42;cursor:default}
.mini.in .grip{visibility:hidden}
.mini.dragging,.pcard.dragging{opacity:.35}
.reddot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger)}
.drop{min-height:230px;border:1px solid #273C4B;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:rgba(16,28,39,.88);transition:border-color .15s,box-shadow .15s}
.drop.over{border-color:var(--accent);box-shadow:0 0 28px rgba(34,211,238,.22)}
.drop-hint{display:none;border:1px dashed var(--accent);border-radius:9px;background:rgba(34,211,238,.09);color:#BFF5FA;padding:13px;text-align:center;font-size:15px;font-weight:500}
body.dragging-lib .drop-hint{display:block}
.drop .empty{color:var(--mute);text-align:center;padding:46px 0;font-size:15px;border:1px dashed #385461;border-radius:9px}
.pcard{background:rgba(11,22,32,.95);border:1px solid #30424D;border-top:3px solid var(--c);border-radius:10px;padding:13px 15px;position:relative}
.pcard.drop-before::before{content:"";position:absolute;left:0;right:0;top:-9px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.pcard .hd{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.pcard .hd .ti{font-weight:700;font-size:16px;flex:1;min-width:200px;cursor:pointer}
.pcard .hd .ti:hover{color:var(--accent)}
.pcard .acts{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;margin-left:auto}
.pcard .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1200px){.pcard .grid3{grid-template-columns:1fr}}
.pcard label{font-size:14px;font-weight:500;color:var(--ink2);display:block;margin-bottom:4px}
.req{color:var(--danger)}
.saved{color:var(--ok);font-size:14px;font-weight:500}
.unsaved{color:var(--warn);font-size:14px;font-weight:500}
.warnbox{background:#2D2615;border:1px solid #6A583A;color:#F2D9A4;border-radius:8px;padding:8px 12px;font-size:14px;margin:6px 0;line-height:1.6}
.counter{font-size:15px;font-weight:700}
pre.report{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:15px;font:15px/1.8 "Noto Sans TC",sans-serif;max-height:520px;overflow:auto;margin:0;color:var(--ink)}
.copilot{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:1050px){.copilot{grid-template-columns:1fr}}
.copilot textarea{min-height:240px;font-size:15px}
.checks{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.checks span{font-size:13px;color:var(--mute);background:#172A34;border:1px solid #304752;border-radius:6px;padding:3px 9px}
.checks span.found{color:var(--ok);border-color:#3E7A65;background:#123A2C}
/* tables */
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-size:14px;color:var(--ink2);background:#0D1922;padding:9px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap;font-weight:500}
table.list td{padding:9px;border-bottom:1px solid var(--line2);vertical-align:top}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#12242F}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.alert{border:1px solid #30424D;border-left:4px solid var(--danger);border-radius:10px;background:rgba(12,23,33,.92);padding:13px 15px}
.alert .rule{font-size:13px;font-weight:700;color:var(--danger);letter-spacing:.02em}
.alert .ti{font-weight:700;font-size:16px;margin:3px 0 6px}
.alert.has{border-left-color:var(--ok)}
.alert.has .rule{color:var(--ok)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(3,8,14,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}
.modal{background:#0F1C27;border:1px solid #2F5363;border-radius:14px;max-width:820px;width:100%;padding:21px 23px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.form input,.form select{width:100%}
@media (max-width:640px){.form{grid-template-columns:1fr}}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:60}
.toast{background:#12323F;border:1px solid #3C869B;color:#E2FBFD;padding:10px 16px;border-radius:10px;font-weight:500;max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.err{background:#3A1418;border-color:#8A3A42;color:#FFD0D0}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #304A57;border-radius:7px;padding:3px 11px;font-size:14px;background:#172934;color:#BCD3DB;font-weight:500}
.chip.on{background:#163541;border-color:var(--accent);color:#BFF5FA}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1050px){.two{grid-template-columns:1fr}}
details summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 15c3-3 6 3 10 0s7 3 10 0"/><path d="M2 9c3-3 6 3 10 0s7 3 10 0"/></svg></div>
    <div><strong>工作水池</strong><small>FINANCE IT WORKSPACE</small></div>
  </div>
  <div class="side">
    <div class="eyebrow">WORKSPACE</div>
    <nav id="nav">
      <button data-tab="timeline" class="on"><em>01</em><span><b>時間軸</b><small>TIMELINE</small></span></button>
      <button data-tab="pool"><em>02</em><span><b>水池與週報</b><small>POOL · REPORT</small></span></button>
      <button data-tab="atm"><em>03</em><span><b>ATM 參考</b><small>ATM SIGNALS</small></span></button>
      <button data-tab="cards"><em>04</em><span><b>卡片庫</b><small>CARD LIBRARY</small></span></button>
      <button data-tab="contracts"><em>05</em><span><b>合約與定期</b><small>CONTRACTS</small></span></button>
      <button data-tab="import"><em>06</em><span><b>匯入</b><small>IMPORT</small></span></button>
    </nav>
  </div>
  <div class="snap" id="snap"></div>
  <div class="side-foot">
    <span id="modePill" class="pill demo">示範模式</span>
    <span id="atmPill" class="pill fresh hidden"></span>
    <div class="row"><button id="btnReload" class="sm" title="重新從 Google Sheet 載入">重新載入</button><button id="btnSettings" class="sm">連線設定</button></div>
  </div>
</aside>
<main class="main">
  <div class="top">
    <div><div class="eyebrow" id="topEyebrow"></div><h1 id="topTitle"></h1><p id="topSub"></p></div>
    <span id="todayTxt" class="mono muted"></span>
  </div>
  <section id="tab-timeline"></section>
  <section id="tab-pool" class="hidden"></section>
  <section id="tab-atm" class="hidden"></section>
  <section id="tab-cards" class="hidden"></section>
  <section id="tab-contracts" class="hidden"></section>
  <section id="tab-import" class="hidden"></section>
</main>
</div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =========================================================
   常數
   ========================================================= */
const TYPES = ['專案','資安專案','定期事項','Release','維修單'];
const ST_GENERAL = ['待處理','進行中','等回覆','已完成'];
const ST_REPAIR = ['開立','已通知廠商','廠商處理中','觀察期','結案'];

const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const pad = n => String(n).padStart(2,'0');
const fmtD = d => d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';
const parseD = s => { if(!s) return null; const t=String(s).slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(t)) return null; const d=new Date(t+'T00:00:00'); return isNaN(d)?null:d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const nowISO = () => new Date().toISOString();
const TODAY = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();

const isDone = c => DONE.has(c['狀態']);
const statusList = type => type==='維修單' ? ST_REPAIR : ST_GENERAL;
const shortVendor = v => { v=String(v||'').trim(); if(!v) return ''; if(v.includes('迪堡')) return '迪堡多富'; if(v.includes('三商')) return '三商'; if(v.includes('國眾')) return '國眾'; return v.replace(/(電腦|資訊|股份有限公司|公司)$/,''); };
function stClass(s){ return DONE.has(s)?'st done':(WAIT.has(s)?'st wait':'st'); }
function parseJSON(v, d){ if(v && typeof v==='object') return v; try{ return JSON.parse(v); }catch(e){ return d; } }

/* 工作週：週四至週三。週別代號＝起始那個週四所在的 ISO 週（例：11/5 週四～11/11 週三 → 2026-W45） */
const WEEK_START_DOW = 4; // 0=週日 … 4=週四
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);
  return `${y}-W${pad(w)}`;
}
const periodStart = d => { const x=new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay()-WEEK_START_DOW+7)%7)); };
const workWeek = d => isoWeek(periodStart(d));
function weekStart(wk){
  const [y,w]=wk.split('-W').map(Number);
  const j4=new Date(y,0,4); const dow=j4.getDay()||7;
  const mon=addDays(addDays(j4,1-dow),(w-1)*7);
  return addDays(mon,(WEEK_START_DOW+6)%7);
}
const shiftWeek = (wk,n) => workWeek(addDays(weekStart(wk),n*7));
const WD = ['日','一','二','三','四','五','六'];
const weekLabel = wk => { const m=weekStart(wk), e=addDays(m,6); return `${wk}（${md(m)} 週${WD[m.getDay()]}–${md(e)} 週${WD[e.getDay()]}）`; };

/* =========================================================

async function api(action, payload={}){
  if(!live()) return {ok:true, demo:true};
  const res = await fetch(ls.get(LS.url,''), {method:'POST', body: JSON.stringify({action, token: ls.get(LS.token,''), ...payload})});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'後端錯誤');
  return j;
}
async function persist(action, payload, okMsg){
  try{ await api(action,payload); if(okMsg) toast(okMsg); return true; }
  catch(e){ toast('寫入 Google Sheet 失敗：'+e.message, true); return false; }
}

async function loadAll(){
  if(!live()){
    S = demoData(); ATM = demoAtm();
  } else {
    try{
      const [a,b] = await Promise.all([api('loadAll'), api('loadAtm')]);
      S = Object.assign(S, a.data); ATM = b.data || ATM;
    }catch(e){ toast('連線失敗：'+e.message+'（已改用示範資料）', true); S=demoData(); ATM=demoAtm(); }
  }
  S.Cards.forEach(c => CARD_FIELDS.forEach(f => { if(c[f]===undefined||c[f]===null) c[f]=''; }));
  await genRecurring(true);
  renderHeader(); render();
}

async function saveCard(c, msg='已儲存'){
  c['更新時間']=nowISO();

/* =========================================================
   時間軸
   ========================================================= */
const SCALES = { week:{days:42,back:10,label:'週'}, month:{days:120,back:21,label:'月'}, quarter:{days:365,back:45,label:'季'} };
let tlOffset = 0;
function renderTimeline(){
  const lane = ls.get(LS.lane,'type'), scale = ls.get(LS.scale,'month'), hideDone = ls.get(LS.hideDone,false);
  const sc = SCALES[scale];
  const start = addDays(TODAY, -sc.back + tlOffset), end = addDays(start, sc.days);
  const pos = d => (daysBetween(start,d)/sc.days*100);
  const laneOf = c => lane==='type'?c['卡片類型']: lane==='vendor'?(shortVendor(c['廠商'])||'（無廠商）'):(c['負責人']||'（未指派）');

  const items=[]; let undated=0;
  S.Cards.forEach(c=>{
    if(hideDone && isDone(c)) return;
    const s=parseD(c['開始日']), e=parseD(c['截止日']);
    if(!s && !e){ undated++; return; }
    items.push({lane:laneOf(c), type:c['卡片類型'], s, e, label:c['標題'], id:c['卡片ID'], done:isDone(c)});
  });
  S.Release_Master.forEach(r=>{
    const s=parseD(r['預計交版日']), e=parseD(r['預計上線日']); if(!s&&!e) return;
    if(hideDone && String(r['整體狀態']).includes('已完成')) return;
    const ln = lane==='type'?'Release': lane==='vendor'?(shortVendor(r['廠商名稱'])||'（無廠商）'):'版本里程碑';
    items.push({lane:ln, type:'Release', s, e, label:`${r['軟體版號']} ${shortVendor(r['廠商名稱'])} 交版`, rel:r, done:String(r['整體狀態']).includes('已完成')});
  });
  const visible = items.filter(it=>{ const a=it.s||it.e, b=it.e||it.s; return b>=start && a<=end; });

  const lanes={};
  visible.forEach(it=>(lanes[it.lane]=lanes[it.lane]||[]).push(it));
  let order = Object.keys(lanes).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  if(lane==='type') order = TYPES.filter(t=>lanes[t]);
  order.forEach(k=>lanes[k].sort((a,b)=>((a.s||a.e)-(b.s||b.e))));

  // 刻度
  let ticks='';
  for(let d=new Date(start.getFullYear(),start.getMonth(),1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    if(d<start) continue;
    ticks+=`<div class="tl-tick" style="left:${pos(d)}%">${d.getFullYear()}/${d.getMonth()+1}</div>`;
  }
  if(scale!=='quarter'){
    let m=addDays(start,(8-(start.getDay()||7))%7);
    for(; m<=end; m=addDays(m,7)) ticks+=`<div class="tl-tick minor" style="left:${pos(m)}%">${md(m)}</div>`;
  }
  let grid='';
  for(let d=new Date(start.getFullYear(),start.getMonth()+1,1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1)) grid+=`<div class="tl-grid" style="left:${pos(d)}%"></div>`;

  const drawItem = it => {
    const cls = `c-${esc(it.type)}`, attr = it.id?`data-card="${esc(it.id)}"`:`data-rel="1"`;
    const title = esc(it.label);
    if(it.s && it.e && daysBetween(it.s,it.e)>=1){
      const l=Math.max(0,pos(it.s)), r=Math.min(100,pos(addDays(it.e,1)));
      let h=`<div class="tl-bar ${cls} ${it.done?'done':''}" ${attr} title="${title}" style="left:${l}%;width:${Math.max(r-l,.6)}%">${title}</div>`;
      if(it.rel) h+=`<div class="tl-dia ${cls}" style="left:calc(${pos(it.e)}% - 8px)" title="上線 ${esc(fmtD(it.e))}"></div>`;
      return h;
    }
    const d=it.e||it.s;
    const mark = it.type==='Release' ? 'tl-dia':'tl-dot';
    return `<div class="${mark} ${cls}" ${attr} title="${title}" style="left:calc(${pos(d)}% - 8px);${it.done?'opacity:.5':''}"></div><div class="tl-lbl" ${attr} style="left:calc(${pos(d)}% + 14px)">${md(d)}　${title}</div>`;
  };
  const lanesHtml = order.map(k=>`<div class="tl-lane"><div class="tl-lname">${esc(k)}<div class="muted" style="font-size:13px;font-weight:400">${lanes[k].length} 項</div></div><div class="tl-track">${grid}${lanes[k].map(it=>`<div class="tl-row">${drawItem(it)}</div>`).join('')}</div></div>`).join('');
  const todayPos = pos(TODAY);

  $('#tab-timeline').innerHTML = `
  <div class="toolbar">
    <span class="label">泳道</span>
    <div class="seg" id="laneSeg">${[['type','卡片類型'],['vendor','廠商'],['owner','負責人']].map(([k,t])=>`<button data-k="${k}" class="${lane===k?'on':''}">${t}</button>`).join('')}</div>
    <span class="label" style="margin-left:8px">尺度</span>
    <div class="seg" id="scaleSeg">${Object.entries(SCALES).map(([k,v])=>`<button data-k="${k}" class="${scale===k?'on':''}">${v.label}</button>`).join('')}</div>
    <button class="sm" id="tlPrev">◀</button><button class="sm" id="tlToday">今天</button><button class="sm" id="tlNext">▶</button>
    <label class="row" style="gap:6px;font-size:15px"><input type="checkbox" id="hideDone" ${hideDone?'checked':''}> 隱藏已完成</label>
    <span class="sp"></span>
    <button class="primary" id="tlNew">＋ 新增卡片</button>
  </div>
  <div class="legend" style="margin-bottom:10px">
    ${TYPES.map(t=>`<span class="tag T-${t}">${t}</span>`).join('')}
    <span class="muted">長條＝有起訖　●＝單日截止　◆＝版本上線</span>
    ${undated?`<span class="muted">・另有 ${undated} 張沒有日期，不顯示</span>`:''}
  </div>
  <div class="tl"><div class="tl-inner">
    <div class="tl-head"><div style="padding:10px;font-weight:700;border-right:1.5px solid var(--line)">${fmtD(start).slice(5)} ～ ${fmtD(end).slice(5)}</div><div class="tl-scale">${ticks}${todayPos>=0&&todayPos<=100?`<div class="tl-todaylbl" style="left:${todayPos}%">今天 ${md(TODAY)}</div>`:''}</div></div>
    <div style="position:relative">
      ${lanesHtml || '<div class="muted" style="padding:40px;text-align:center">這段期間沒有卡片</div>'}
      ${todayPos>=0&&todayPos<=100?`<div style="position:absolute;top:0;bottom:0;left:150px;right:0;pointer-events:none"><div class="tl-today" style="left:${todayPos}%"></div></div>`:''}
    </div>
  </div></div>`;
  $('#laneSeg').onclick=e=>{const b=e.target.closest('button'); if(b){ls.set(LS.lane,b.dataset.k); renderTimeline();}};
  $('#scaleSeg').onclick=e=>{const b=e.target.closest('button'); if(b){ls.set(LS.scale,b.dataset.k); tlOffset=0; renderTimeline();}};
  $('#tlPrev').onclick=()=>{tlOffset-=Math.round(sc.days/3); renderTimeline();};
  $('#tlNext').onclick=()=>{tlOffset+=Math.round(sc.days/3); renderTimeline();};
  $('#tlToday').onclick=()=>{tlOffset=0; renderTimeline();};
  $('#hideDone').onchange=e=>{ls.set(LS.hideDone,e.target.checked); renderTimeline();};
  $('#tlNew').onclick=()=>openCard(blankCard());
  $('#tab-timeline').onclick=e=>{ const el=e.target.closest('[data-card]'); if(el) openCard(cardById(el.dataset.card)); };
}

async function addToPool(id){
  const wk=CUR_WEEK, ids=poolIds(wk); if(ids.includes(id)) return;
  ids.push(id); await setPool(wk,ids);
}
async function placeInPool(id, beforeId){
  const wk=CUR_WEEK; let ids=poolIds(wk); const had=ids.includes(id);
  if(beforeId===id) return;
  ids=ids.filter(x=>x!==id);
  const at=beforeId?ids.indexOf(beforeId):-1;
  if(at>=0) ids.splice(at,0,id); else ids.push(id);
  if(had && ids.join()===poolIds(wk).join()) return;
  await setPool(wk,ids);
  if(!had) toast('已加入本週水池');
}

async function saveProgress(ids){

}

function buildReport(wk){
  const pool=poolIds(wk);
  const logs=S.Progress_Log.filter(p=>p['週別']===wk && cardById(p['卡片ID']));
  logs.sort((a,b)=>{const ia=pool.indexOf(a['卡片ID']), ib=pool.indexOf(b['卡片ID']); return (ia<0?999:ia)-(ib<0?999:ib);});
  const sec = field => {
    const groups=new Map();
    logs.filter(l=>String(l[field]||'').trim()).forEach(l=>{
      const c=cardById(l['卡片ID']); const key=String(c['關聯單號']||'').trim()||('#'+c['卡片ID']);
      if(!groups.has(key)) groups.set(key,[]); groups.get(key).push({c,l});
    });
    if(!groups.size) return '（無）';
    const ind = t => String(t).trim().replace(/\n/g,'\n　　');
    return [...groups.entries()].map(([key,arr])=>{
      const ref = key.startsWith('#')?'':key;
      if(arr.length===1){ const {c,l}=arr[0]; return `◆ ${ref?ref+'｜':''}${c['標題']}【${l['狀態']}】\n　　${ind(l[field])}`; }
      return `◆ ${ref}\n`+arr.map(({c,l})=>`　・${c['標題']}【${l['狀態']}】\n　　${ind(l[field])}`).join('\n');
    }).join('\n\n');
  };
  const m=weekStart(wk);
  const text = `【週報】${wk}（${fmtD(m)} ～ ${fmtD(addDays(m,6))}）\n\n一、本週關鍵進展\n${sec('本週進展')}\n\n二、風險與協同事項\n${sec('風險與協同')}\n\n三、下週預計推展\n${sec('下週預計')}\n`;
  const ctx = logs.map(l=>{const c=cardById(l['卡片ID']); return `- ${c['關聯單號']||'（無單號）'}｜${c['標題']}｜類型:${c['卡片類型']}｜廠商:${c['廠商']||'-'}｜負責:${c['負責人']||'-'}｜狀態:${l['狀態']}｜截止:${String(c['截止日']||'-').slice(0,10)}`;}).join('\n');
  return {text, ctx, count:logs.length};
}

/* =========================================================
   ATM 參考與維修單規則
   ========================================================= */
function catOf(row){
  const ov=ls.get(LS.catOverride,{}); if(ov[row.id]) return ov[row.id];
  const t=(row.description||'')+' '+(row.vendorAnalysis||'')+' '+(row.solution||'');
  for(const c of FAULT_CATS) if(c.kw.some(k=>t.includes(k))) return c.name;
  return OTHER_CAT;
}
const isMoneyCat = n => !!(FAULT_CATS.find(c=>c.name===n)||{}).money;
const mcode = r => `${r.poCode}-${r.machineNo}`;
const atmDate = s => { const d=new Date(s); return isNaN(d)?null:d; };

function computeAlerts(){
  const rows=ATM.rows.map(r=>({...r, cat:catOf(r), code:mcode(r), vend:shortVendor(r.vendor), t:atmDate(r.issueTime)})).filter(r=>r.t);
  const since60=addDays(TODAY,-60), recent=rows.filter(r=>r.t>=since60);
  const alerts=[];
  const group=(arr,keyFn)=>{const m=new Map(); arr.forEach(r=>{const k=keyFn(r); if(!m.has(k)) m.set(k,[]); m.get(k).push(r);}); return m;};
  // 1a 同廠商跨機台
  group(recent,r=>r.vend+'|'+r.cat).forEach((arr,k)=>{
    if(arr.length>=3 && new Set(arr.map(r=>r.code)).size>=2){
      alerts.push({rule:'1a', label:'1a 同廠商跨機台 60 天同類 ≥3 次', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
        title:`${arr[0].vend} ${arr[0].cat}跨局反覆發生（${new Set(arr.map(r=>r.code)).size} 台、${arr.length} 次）`});
    }
  });
  // 1b 單機台
  group(recent,r=>r.code+'|'+r.cat).forEach((arr,k)=>{
    if(arr.length>=3) alerts.push({rule:'1b', label:'1b 同機台 60 天同類 ≥3 次', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
      title:`${arr[0].poName} ${arr[0].code} ${arr[0].cat} ${arr.length} 次`});
  });
  // 2 帳務／客戶權益
  group(recent.filter(r=>isMoneyCat(r.cat)),r=>r.code+'|'+r.cat).forEach((arr,k)=>{
    alerts.push({rule:'2', label:'2 帳務／客戶權益 1 次即開', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
      title:`${arr[0].poName} ${arr[0].code} ${arr[0].cat}`});
  });
  // 3 反覆維修
  group(rows,r=>r.code).forEach((arr,code)=>{
    arr.sort((a,b)=>a.t-b.t);
    const hits=[];
    for(let i=1;i<arr.length;i++){
      const prev=arr[i-1], rt=atmDate(prev.resolveTime);
      if(prev.status==='已結案' && rt && arr[i].t>=rt && daysBetween(rt,arr[i].t)<=30 && arr[i].t>=since60) hits.push(`${md(rt)} 結案後 ${daysBetween(rt,arr[i].t)} 天再故障`);
    }
    arr.forEach(r=>{ const n=(r.logs||[]).filter(l=>/到場|派員|到府|現場維修/.test(l.note||'')).length; if(n>=2 && r.t>=since60) hits.push(`同案廠商到場 ${n} 次`); });
    if(hits.length) alerts.push({rule:'3', label:'3 反覆維修', key:code, vend:arr[0].vend, cat:arr[arr.length-1].cat, cases:arr.filter(r=>r.t>=since60), reason:hits,
      title:`${arr[arr.length-1].poName} ${code} 修完又壞`});
  });
  // 對應既有維修單
  const tickets=S.Cards.filter(c=>c['卡片類型']==='維修單');
  alerts.forEach(a=>{
    const codes=new Set(a.cases.map(r=>r.code));
    a.ticket = tickets.find(c=>c['來源ID']===`ATM-${a.rule}-${a.key}`)
      || tickets.find(c=>!isDone(c) && c['故障類別']===a.cat && parseJSON(c['機台清單'],[]).some(m=>codes.has(m.machine)));
  });
  const rank={'2':0,'1a':1,'3':2,'1b':3};

/* =========================================================
   合約與定期卡
   ========================================================= */
function holidayMap(){ const m={}; S.Holidays.forEach(h=>{ const d=String(h['日期']).slice(0,10); if(d) m[d]=h['類型']||'假日'; }); return m; }
function isWorkday(d, hm){ const k=fmtD(d); if(hm[k]==='補班') return true; if(hm[k]) return false; const w=d.getDay(); return w!==0&&w!==6; }
function prevWorkday(d, hm){ let x=new Date(d); for(let i=0;i<20&&!isWorkday(x,hm);i++) x=addDays(x,-1); return x; }
function dayIn(y,m,day){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m, day==='末'?last:Math.min(Number(day),last)); }
/** 依規則列出 from 起的候選日期，回傳 [{date, period}] */
function ruleDates(rule, from, until, anchorYear){
  const out=[]; const r=String(rule||'').trim().toUpperCase().replace('：',':'); const p=r.split(':');
  const push=(d,per)=>{ if(d>=from && d<=until) out.push({date:d,period:per}); };
  const y0=from.getFullYear(), y1=until.getFullYear();
  if(p[0]==='W'){ const wd=Number(p[1])%7; let d=addDays(from,(wd-from.getDay()+7)%7); for(;d<=until;d=addDays(d,7)) push(d,workWeek(d)); }
  else if(p[0]==='M'){ for(let y=y0;y<=y1;y++) for(let m=0;m<12;m++) push(dayIn(y,m,p[1]==='末'?'末':p[1]),`${y}-${pad(m+1)}`); }
  else if(p[0]==='Q'){ const mi=p.length>=3?Number(p[1]):3, day=p.length>=3?p[2]:p[1]; for(let y=y0;y<=y1;y++) for(let q=0;q<4;q++) push(dayIn(y,q*3+mi-1,day==='末'?'末':day),`${y}-Q${q+1}`); }
  else if(p[0]==='H'){ const day=p[1]||'末'; for(let y=y0;y<=y1;y++){ push(dayIn(y,5,day),`${y}-H1`); push(dayIn(y,11,day),`${y}-H2`); } }
  else if(p[0]==='Y'||p[0]==='2Y'){ const months=String(p[1]||'').split(',').map(Number).filter(Boolean), day=p[2]||'末';
    for(let y=y0;y<=y1;y++){ if(p[0]==='2Y' && (y-anchorYear)%2!==0) continue; months.forEach(m=>push(dayIn(y,m-1,day),months.length>1?`${y}-${pad(m)}`:`${y}`)); } }
  return out.sort((a,b)=>a.date-b.date);
}
function validRule(rule){ return /^(W:[1-7]|M:(\d{1,2}|末)|Q:(\d{1,2}|末)|Q:[1-3]:(\d{1,2}|末)|H:(\d{1,2}|末)|Y:[\d,]+:(\d{1,2}|末)|2Y:[\d,]+:(\d{1,2}|末))$/.test(String(rule||'').trim().toUpperCase().replace('：',':')); }
async function genRecurring(silent){
  const hm=holidayMap(), have=new Set(S.Cards.map(c=>c['來源']+'|'+c['來源ID'])), add=[];
  S.Contracts.forEach(k=>{
    const obls=parseJSON(k['定期義務'],[]); if(!Array.isArray(obls)) return;
    const cs=parseD(k['起日'])||new Date(TODAY.getFullYear()-1,0,1), ce=parseD(k['迄日'])||addDays(TODAY,3650);
    const from=new Date(Math.max(cs, addDays(TODAY,-7))), until=new Date(Math.min(ce, addDays(TODAY,365*5)));
    obls.forEach(o=>{
      if(!validRule(o['規則'])) return;
      ruleDates(o['規則'],from,addDays(until,7),cs.getFullYear()).filter(x=>x.date<=ce).slice(0,3).forEach(x=>{
        const due=prevWorkday(x.date,hm), sid=`${k['合約ID']}|${o['項目']}|${x.period}`;
        if(have.has('合約|'+sid)) return; have.add('合約|'+sid);

      });
    });
  });
  if(add.length){ S.Cards.push(...add); await persist('importCards',{rows:add}, silent?`已自動產生 ${add.length} 張定期卡`:null); }
  if(!silent) toast(add.length?`新增 ${add.length} 張定期卡`:'定期卡都已是最新，沒有新增');
  return add.length;
}

function openContract(k,isNew){

        <div class="full"><label>備註</label><textarea id="k-備註" rows="2">${esc(k['備註'])}</textarea></div>

      <div class="row" style="margin-top:16px"><span class="sp"></span><button class="primary" id="kSave">儲存並更新定期卡</button></div>

    $('#obAdd').onclick=()=>{ sync(); ob.push({項目:'',規則:'',負責人:''}); draw(); };
    $$('[data-del]',root).forEach(b=>b.onclick=()=>{ sync(); ob.splice(Number(b.dataset.del),1); draw(); });
    $('#kSave').onclick=async()=>{
      sync();
      ['合約ID','廠商','合約名稱','起日','迄日','備註'].forEach(f=>k[f]=$('#k-'+f).value.trim());
      if(!k['合約ID']||!k['合約名稱']){ toast('合約ID 與合約名稱必填',true); return; }
      const clean=ob.filter(o=>o['項目']&&o['規則']);
      const bad=clean.filter(o=>!validRule(o['規則'])); if(bad.length){ toast(`規則格式錯誤：${bad.map(o=>o['規則']).join('、')}`,true); return; }
      if(isNew && S.Contracts.some(x=>x['合約ID']===k['合約ID'])){ toast('合約ID 已存在',true); return; }
      k['定期義務']=JSON.stringify(clean);
      const i=S.Contracts.findIndex(x=>x['合約ID']===k['合約ID']); if(i>=0) S.Contracts[i]=k; else S.Contracts.push(k);
      root.innerHTML='';
      await persist('saveContracts',{rows:[k]},'合約已儲存');
      await genRecurring(false); render();
    };
  };
  const sync=()=>$$('[data-i]',root).forEach(el=>{ ob[Number(el.dataset.i)][el.dataset.k]=el.value.trim(); });
  draw();
}

function checkImport(){
  const box=$('#impPrev'); let raw=$('#impText').value.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  let j; try{ j=JSON.parse(raw); }catch(e){ box.innerHTML=`<div class="warnbox">JSON 格式錯誤：${esc(e.message)}</div>`; return; }
  const cardsIn = Array.isArray(j)?j:(j.cards||[]), contractsIn = Array.isArray(j)?[]:(j.contracts||[]);
  const have=new Set(S.Cards.map(c=>c['來源']+'|'+c['來源ID'])), seen=new Set();
  const res={add:[],skip:[],err:[],kAdd:[],kSkip:[]};
  cardsIn.forEach((o,i)=>{
    const errs=[]; const c=blankCard({來源:'匯入'});
    CARD_FIELDS.forEach(f=>{ if(o[f]!==undefined && o[f]!==null && f!=='卡片ID') c[f]=typeof o[f]==='object'?JSON.stringify(o[f]):String(o[f]).trim(); });
    if(!c['標題']) errs.push('缺標題');
    if(!TYPES.includes(c['卡片類型'])) { errs.push(`卡片類型「${c['卡片類型']}」不在清單，已改為專案`); c['卡片類型']='專案'; }
    if(!statusList(c['卡片類型']).includes(c['狀態'])) c['狀態']=statusList(c['卡片類型'])[0];
    ['開始日','截止日'].forEach(f=>{ if(c[f] && !parseD(c[f])) { errs.push(`${f}「${c[f]}」格式錯誤，已清空`); c[f]=''; } });
    if(!c['來源ID']) c['來源ID']='T:'+c['標題'];
    const key=c['來源']+'|'+c['來源ID'];
    if(!c['標題']) res.err.push({i:i+1,msg:errs.join('；')});
    else if(have.has(key)||seen.has(key)) res.skip.push(c);
    else { seen.add(key); res.add.push({c,warn:errs}); }
  });
  contractsIn.forEach(k=>{
    const kk={合約ID:String(k['合約ID']||'').trim(),合約名稱:String(k['合約名稱']||'').trim(),廠商:k['廠商']||'',起日:k['起日']||'',迄日:k['迄日']||'',備註:k['備註']||'',定期義務:JSON.stringify(Array.isArray(k['定期義務'])?k['定期義務']:parseJSON(k['定期義務'],[]))};
    if(!kk['合約ID']||!kk['合約名稱']) res.err.push({i:'合約',msg:'合約缺少合約ID或名稱'});
    else if(S.Contracts.some(x=>x['合約ID']===kk['合約ID'])) res.kSkip.push(kk); else res.kAdd.push(kk);
  });
  IMP=res;
  box.innerHTML=`<div class="row" style="margin-bottom:8px">
      <span class="pill live">新增卡片 ${res.add.length}</span><span class="pill stale">跳過（已存在）${res.skip.length}</span>
      ${res.kAdd.length||res.kSkip.length?`<span class="pill live">新增合約 ${res.kAdd.length}</span><span class="pill stale">跳過合約 ${res.kSkip.length}</span>`:''}
      ${res.err.length?`<span class="pill" style="border-color:#8A3A42;color:#FFB4B4;background:#3A1418">錯誤 ${res.err.length}</span>`:''}
    </div>
    ${res.err.map(e=>`<div class="warnbox">第 ${esc(e.i)} 筆：${esc(e.msg)}</div>`).join('')}
    <table class="list"><thead><tr><th>結果</th><th>類型</th><th>標題</th><th>截止日</th><th>來源ID</th></tr></thead><tbody>
      ${res.add.map(({c,warn})=>`<tr><td><span class="st done">新增</span></td><td><span class="tag T-${esc(c['卡片類型'])}">${esc(c['卡片類型'])}</span></td><td>${esc(c['標題'])}${warn.length?`<div class="unsaved">${esc(warn.join('；'))}</div>`:''}</td><td class="mono">${esc(c['截止日'])}</td><td class="mono muted">${esc(c['來源ID'])}</td></tr>`).join('')}
      ${res.skip.map(c=>`<tr style="opacity:.6"><td><span class="st wait">跳過</span></td><td>${esc(c['卡片類型'])}</td><td>${esc(c['標題'])}</td><td class="mono">${esc(c['截止日'])}</td><td class="mono muted">${esc(c['來源ID'])}</td></tr>`).join('')}
      ${res.kAdd.map(k=>`<tr><td><span class="st done">新增合約</span></td><td>合約</td><td>${esc(k['合約名稱'])}</td><td class="mono">${esc(k['迄日'])}</td><td class="mono muted">${esc(k['合約ID'])}</td></tr>`).join('')}
    </tbody></table>
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="primary" id="impGo" ${res.add.length||res.kAdd.length?'':'disabled'}>確認匯入</button></div>`;
  const go=$('#impGo'); if(go) go.onclick=doImport;
}
async function doImport(){
  if(!IMP) return; const rows=IMP.add.map(x=>x.c), ks=IMP.kAdd;

  if(rows.length) await persist('importCards',{rows});
  if(ks.length) await persist('saveContracts',{rows:ks});
  const n = ks.length ? await genRecurring(true) : 0;
  toast(`已匯入 ${rows.length} 張卡片${ks.length?`、${ks.length} 份合約`:''}${n?`，並產生 ${n} 張定期卡`:''}`);
  IMP=null; $('#impText').value=''; $('#impPrev').innerHTML='';
}
