/* ===== 設計系統：Cobalt Frost（冰霜白 × 鈷藍）===== */
:root{
  --ink:#1B2A4A; --ink2:#46587E; --mute:#5C6E95;
  --bg:#EDF2F9; --card:#FFFFFF; --card2:#F5F8FD; --soft:#F2F6FC; --hover:#E2EAF7;
  --line:#D5DFEE; --line2:#E6ECF7; --edge:#E3EAF6;
  --accent:#2F5FD0; --accent2:#2F5FD0; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --navy:#263F78; --navy2:#223B70;
  --danger:#B23B3B; --warn:#A9701A; --ok:#1E8E74;
  --t-proj:#2F5FD0; --t-proj-ink:#1F4AB5; --t-proj-bg:#E3EBFB;
  --t-sec:#7A6FD0;  --t-sec-ink:#5A4FB5;  --t-sec-bg:#ECE9F9;
  --t-rec:#2A8FD0;  --t-rec-ink:#1B6FA8;  --t-rec-bg:#E0F0FA;
  --t-rel:#1F3A7A;  --t-rel-ink:#1F3A7A;  --t-rel-bg:#E1E7F4;
  --t-rep:#C98A1F;  --t-rep-ink:#8A5A0C;  --t-rep-bg:#FBF0DA;
  --r:10px;
  --shadow:0 1px 2px rgba(31,62,140,.06),0 10px 28px rgba(31,62,140,.08);
  --f-body:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;font-weight:500}
button:hover{background:var(--hover)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--hover)}
button.danger{border-color:#E5B1B1;background:#FDECEC;color:#A12F2F}
button.danger:hover{background:#FADCDC}
button.sm{padding:4px 11px;font-size:14px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--card2);min-width:0}
input::placeholder,textarea::placeholder{color:#7D8EB0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,95,208,.16);background:#fff}
input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
textarea{width:100%;resize:vertical;line-height:1.6}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:14px}
.eyebrow{font:500 12.5px var(--f-mono);letter-spacing:.14em;color:var(--accent)}
.eyebrow span{color:#8EA6DD}
/* layout */
.app{display:flex;min-height:100vh;position:relative}
.sidebar{position:sticky;top:0;height:100vh;width:264px;flex-shrink:0;z-index:30;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2A4783 0%,#223B70 100%);color:#EAF1FC;
  --ink:#EAF1FC;--ink2:#C3D1EC;--mute:#A3B7DD;--line:rgba(255,255,255,.18)}
.brand{padding:24px 18px 18px;display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:var(--r);color:#fff}
.brand strong{display:block;font-size:18px;letter-spacing:.06em;color:#fff}
.brand small{display:block;color:#A3B7DD;font:11.5px var(--f-mono);letter-spacing:0;margin-top:2px;white-space:nowrap}
.side{padding:10px 14px 20px;overflow-y:auto;flex:1}
.side .eyebrow{color:#A3B7DD}
#nav{display:flex;flex-direction:column;gap:3px;margin-top:10px}
#nav button{width:100%;display:flex;align-items:center;gap:12px;border:1px solid transparent;border-radius:var(--r);padding:7px 12px;background:none;text-align:left;color:#C3D1EC}
#nav button b{display:block;font-size:16px;font-weight:500}
#nav button small{display:block;font:11.5px var(--f-mono);letter-spacing:.06em;color:#A3B7DD;margin-top:1px}
#nav button em{font:13px var(--f-mono);font-style:normal;color:#A3B7DD;width:22px}
#nav button:hover{background:rgba(255,255,255,.08)}
#nav button.on{background:rgba(255,255,255,.15);color:#fff}
#nav button.on b{font-weight:700}
#nav button.on em{color:#8CC4FF}
.snap{margin:0 14px 14px;border-radius:var(--r);padding:14px 15px;background:rgba(255,255,255,.09)}
.snap .eyebrow{color:#A3B7DD;font-size:12px;letter-spacing:.06em}
.snap .r{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;color:#C3D1EC;font-size:15px}
.snap .r b{color:#fff;font:500 18px var(--f-mono)}
.snap .r b.hot{color:#F2C879}
.gauge{display:flex;align-items:center;gap:12px;margin-top:10px}
.ring{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(#8CC4FF calc(var(--p)*1%),rgba(255,255,255,.2) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#2F4C88}
.ring span{position:relative;font:500 14px var(--f-mono);color:#fff}
.gauge>div:last-child{font-size:15px;color:#C3D1EC;line-height:1.35}
.gauge small{display:block;font-size:13px;color:#A3B7DD}
.side-foot{padding:12px 14px 18px;display:flex;flex-direction:column;gap:8px}
.side-foot .row{gap:8px}
.side-foot button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#EAF1FC}
.side-foot button:hover{background:rgba(255,255,255,.18)}
.main{flex:1;min-width:0;padding:30px clamp(16px,2.8vw,42px) 44px;position:relative}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:30px;letter-spacing:.01em;margin:6px 0 2px;font-weight:700;line-height:1.25}
.top p{margin:0;color:var(--ink2);font-size:15px}
.hero{border-radius:var(--r);min-height:140px;background:linear-gradient(180deg,#2A4783 0%,#223B70 100%);padding:24px 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;overflow:hidden;color:#EAF1FC;box-shadow:var(--shadow)}
.hero .eyebrow{color:#A3C4FF}
.hero .eyebrow span{color:#6F8FD0}
.hero h2{font-size:23px;letter-spacing:.01em;margin:8px 0 4px;color:#fff}
.hero p{margin:0;color:#C3D1EC;font-size:15px}
.hero .big{text-align:right}
.hero .big b{display:block;font:500 34px var(--f-mono);color:#fff;line-height:1.1}
.hero .big span{font:12.5px var(--f-mono);letter-spacing:.1em;color:#A3B7DD}
@media (max-width:980px){
  .app{display:block}
  .sidebar{position:relative;height:auto;width:auto}
  .brand{padding:12px 16px}
  .side{padding:0 10px 8px;overflow:visible}
  .side .eyebrow,.snap{display:none}
  #nav{flex-direction:row;overflow-x:auto;margin:0}
  #nav button{width:auto;white-space:nowrap;padding:6px 12px}
  #nav button small{display:none}#nav button .ni{width:18px;height:18px}
  .side-foot{flex-direction:row;flex-wrap:wrap;padding:0 14px 10px}
  .hero .big{display:none}
}

/* ===== 訪談寫法 / 管理層表格 ===== */
.iv-btn{background:var(--accent-soft);border-color:var(--accent);color:#1F4AB5;font-weight:600}
.iv-modal{max-width:1120px}
.iv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px}
.iv-left{display:flex;flex-direction:column;gap:14px;min-width:0}
.iv-right{min-width:0}
.iv-steps{display:flex;gap:6px;flex-wrap:wrap}
.iv-steps button{width:34px;height:34px;padding:0;border-radius:50%;font:500 13px var(--f-mono)}
.iv-steps button.done{background:var(--accent-soft);border-color:var(--accent);color:#1F4AB5}
.iv-steps button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.iv-q{background:var(--soft);border-radius:var(--r);padding:16px 18px}
.iv-n{font:500 12.5px var(--f-mono);color:var(--accent);letter-spacing:.1em}
.iv-q h3{margin:4px 0 4px;font-size:19px;line-height:1.4}
.iv-fields{display:flex;flex-direction:column;gap:10px;margin-top:14px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}

.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent);color:#fff;font-weight:700}
.label{font-size:14px;color:var(--mute);font-weight:500}

.tag{display:inline-block;border-radius:5px;padding:0 8px;font-size:13px;font-weight:700;line-height:23px;white-space:nowrap;border:1px solid}
.T-專案{color:var(--t-proj-ink);background:var(--t-proj-bg);border-color:#BCD0F5}

.T-Release{color:var(--t-rel-ink);background:var(--t-rel-bg);border-color:#BAC6E4}

.st{display:inline-block;border-radius:5px;padding:0 8px;font-size:13px;font-weight:500;line-height:23px;border:1px solid var(--line);color:var(--ink2);background:var(--soft);white-space:nowrap}

.tl-lbl{position:absolute;top:3px;font-size:14px;line-height:25px;white-space:nowrap;color:var(--ink);font-weight:500;cursor:pointer}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);pointer-events:none}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);pointer-events:none;z-index:3}

.tl-todaylbl{position:absolute;top:3px;background:var(--accent);color:#fff;font:500 12px var(--f-mono);padding:0 8px;border-radius:0 4px 4px 0;z-index:2;white-space:nowrap}
.c-專案{--c:var(--t-proj);--cb:var(--t-proj-bg);--ci:var(--t-proj-ink)}

.tl-bar{color:var(--ci);background:var(--cb);border-color:var(--c)}

.tl-seg{position:absolute;top:28px;height:18px;border-radius:4px;border:1px solid var(--c);background:var(--cb);cursor:pointer}
.tl-seg.done,.tl-sdia.done{opacity:.45}

.tl-sdia.cur{border-color:var(--accent);background:#CFDDF8}

/* tables */

.mask{position:fixed;inset:0;background:rgba(27,42,74,.48);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}

.form label{display:block;font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:4px}

.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

details summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

'use strict';
/* =========================================================
   常數
   ========================================================= */
const TYPES = ['專案','資安專案','定期事項','Release','維修單'];
const ST_GENERAL = ['待處理','進行中','等回覆','已完成'];
const ST_REPAIR = ['開立','已通知廠商','廠商處理中','觀察期','結案'];
const DONE = new Set(['已完成','結案']);
const WAIT = new Set(['等回覆','已通知廠商','觀察期']);
const CARD_FIELDS = ['卡片ID','卡片類型','區塊分類','標題','關聯單號','廠商','負責人','狀態','開始日','截止日','合約ID','版本ID','來源','來源ID','期別','機台清單','故障類別','觸發規則','描述','建立時間','更新時間','結案時間'];
const FAULT_CATS = [

  {name:'讀卡／吃卡', kw:['吃卡','讀卡','卡片被吃','退卡','卡住卡'], money:true},
  {name:'交易／結帳', kw:['未完成交易','結帳','小計','DMS','電文','帳務','扣款'], money:true},

  {name:'系統／派版', kw:['派版','重灌','當機','綠屏','全綠','重開機','重啟','韌體','卡死'], money:false}

  timeline:['01 / TIMELINE','時間軸','所有卡片與版本里程碑的時程，可切換泳道與尺度'],
  pool:['02 / WEEKLY POOL','水池與週報','把本週要回報的卡片拖進水池，寫完進度就能產出週報'],

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const pad = n => String(n).padStart(2,'0');
const fmtD = d => d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';
const parseD = s => { if(s===''||s===null||s===undefined) return null; if(typeof s==='number'||/^\d{5}(\.\d+)?$/.test(String(s))){ const u=new Date(Date.UTC(1899,11,30)+Math.floor(Number(s))*86400000); return new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate()); } const t=String(s).slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(t)) return null; const d=new Date(t+'T00:00:00'); return isNaN(d)?null:d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
const nowISO = () => new Date().toISOString();
const TODAY = (()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; })();
const newId = () => { const d=new Date(); return `C-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${Math.random().toString(36).slice(2,6).toUpperCase()}`; };
const isDone = c => DONE.has(c['狀態']);
const statusList = type => type==='維修單' ? ST_REPAIR : ST_GENERAL;
const shortVendor = v => { v=String(v||'').trim(); if(!v) return ''; if(v.includes('迪堡')) return '迪堡多富'; if(v.includes('三商')) return '三商'; if(v.includes('國眾')) return '國眾'; return v.replace(/(電腦|資訊|股份有限公司|公司)$/,''); };
function stClass(s){ return DONE.has(s)?'st done':(WAIT.has(s)?'st wait':'st'); }
function parseJSON(v, d){ if(v && typeof v==='object') return v; try{ return JSON.parse(v); }catch(e){ return d; } }

/* 工作週：週四至週三。週別代號＝起始那個週四所在的 ISO 週（例：11/5 週四～11/11 週三 → 2026-W45） */
const WEEK_START_DOW = 4; // 0=週日 … 4=週四
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day);
  const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/86400000+1)/7);
  return `${y}-W${pad(w)}`;
}
const periodStart = d => { const x=new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay()-WEEK_START_DOW+7)%7)); };
const workWeek = d => isoWeek(periodStart(d));
function weekStart(wk){
  const [y,w]=wk.split('-W').map(Number);
  const j4=new Date(y,0,4); const dow=j4.getDay()||7;
  const mon=addDays(addDays(j4,1-dow),(w-1)*7);
  return addDays(mon,(WEEK_START_DOW+6)%7);
}
const shiftWeek = (wk,n) => workWeek(addDays(weekStart(wk),n*7));
const WD = ['日','一','二','三','四','五','六'];
const weekLabel = wk => { const m=weekStart(wk), e=addDays(m,6); return `${wk}（${md(m)} 週${WD[m.getDay()]}–${md(e)} 週${WD[e.getDay()]}）`; };

async function api(action, payload={}){
  if(!live()) return {ok:true, demo:true};
  const res = await fetch(ls.get(LS.url,''), {method:'POST', body: JSON.stringify({action, token: ls.get(LS.token,''), ...payload})});
  const j = await res.json();
  if(!j.ok) throw new Error(j.error||'後端錯誤');
  return j;
}

const cardById = id => S.Cards.find(c=>c['卡片ID']===id) || virtualCards().find(c=>c['卡片ID']===id);
async function saveCard(c, msg='已儲存'){
  c['更新時間']=nowISO();
  if(DONE.has(c['狀態']) && !c['結案時間']) c['結案時間']=nowISO();
  if(!DONE.has(c['狀態'])) c['結案時間']='';
  const i=S.Cards.findIndex(x=>x['卡片ID']===c['卡片ID']);
  if(i>=0) S.Cards[i]=c; else S.Cards.push(c);
  await persist('saveCards',{rows:[c]},msg);
}
/** 把 srcId 併入 dstId：機台聯集、描述保留、歷週進度與水池轉移、ATM 警示來源ID 保留，最後刪除 src */
async function mergeCards(srcId, dstId){
  const s=S.Cards.find(x=>x['卡片ID']===srcId), d=S.Cards.find(x=>x['卡片ID']===dstId);
  if(!s||!d||s===d) return;
  const union=(a,b,sep)=>[...new Set([a,b].flatMap(v=>String(v||'').split(sep)).map(x=>x.trim()).filter(Boolean))];
  const ms=[...parseJSON(d['機台清單'],[])]; parseJSON(s['機台清單'],[]).forEach(m=>{ if(!ms.some(x=>x.machine===m.machine)) ms.push(m); });
  if(ms.length) d['機台清單']=JSON.stringify(ms);
  d['來源ID']=union(d['來源ID'],s['來源ID'],/\s*;\s*/).join('; ');   // ATM 警示靠它判斷「已建單」
  d['故障類別']=union(d['故障類別'],s['故障類別'],'、').join('、');
  d['觸發規則']=union(d['觸發規則'],s['觸發規則'],'；').join('；');
  d['描述']=[d['描述'], `【併入：${s['標題']}${s['關聯單號']?'｜'+s['關聯單號']:''}】${s['描述']||''}`].filter(Boolean).join('\n\n');
  if(s['開始日'] && (!d['開始日'] || s['開始日']<d['開始日'])) d['開始日']=s['開始日'];
  if(!d['關聯單號'] && s['關聯單號']) d['關聯單號']=s['關聯單號'];
  d['更新時間']=nowISO();
  // 歷週進度：同一週都有寫的，文字接在一起
  const rows=[];
  S.Progress_Log.filter(p=>p['卡片ID']===srcId).forEach(p=>{
    const q=S.Progress_Log.find(x=>x['週別']===p['週別']&&x['卡片ID']===dstId);
    if(q){ ['本週進展','風險與協同','下週預計'].forEach(k=>{ if(p[k]) q[k]=(q[k]?q[k]+'\n':'')+`（${s['標題']}）${p[k]}`; }); rows.push(q); }
    else { const n={...p,卡片ID:dstId}; S.Progress_Log.push(n); rows.push(n); }
  });
  S.Progress_Log=S.Progress_Log.filter(p=>p['卡片ID']!==srcId);
  // 水池：有 src 的週，換成 dst（dst 已在水池就直接移除 src）
  const weeks=[...new Set(S.Weekly_Pool.filter(p=>p['卡片ID']===srcId).map(p=>p['週別']))], pools=[];
  weeks.forEach(wk=>{ let ids=poolIds(wk); ids=ids.includes(dstId)?ids.filter(x=>x!==srcId):ids.map(x=>x===srcId?dstId:x);
    S.Weekly_Pool=S.Weekly_Pool.filter(p=>p['週別']!==wk).concat(ids.map((id,i)=>({週別:wk,卡片ID:id,排序:i+1,加入時間:nowISO()}))); pools.push([wk,ids]); });
  S.Cards=S.Cards.filter(x=>x['卡片ID']!==srcId);
  const ok = await persist('saveCards',{rows:[d]})
    && (!rows.length || await persist('saveProgress',{rows}))
    && (await Promise.all(pools.map(([wk,ids])=>persist('setPool',{week:wk,cardIds:ids})))).every(Boolean)
    && await persist('deleteCard',{id:srcId});
  toast(ok?`已併入「${d['標題']}」`:'合併時寫入 Google Sheet 失敗，請重新載入確認', !ok);
}

}

/* =========================================================

const SCALES = { week:{days:42,back:10,label:'週'}, month:{days:120,back:21,label:'月'}, quarter:{days:365,back:45,label:'季'} };
let tlOffset = 0;
function renderTimeline(){
  const lane = ls.get(LS.lane,'vendor'), scale = ls.get(LS.scale,'month'), hideDone = ls.get(LS.hideDone,false);
  const sc = SCALES[scale];
  const start = addDays(TODAY, -sc.back + tlOffset), end = addDays(start, sc.days);
  const pos = d => (daysBetween(start,d)/sc.days*100);
  const vendLane = c => { const v=shortVendor(c['廠商']); if(!v) return '行內／共通（無廠商）'; const t=teamOfCard(c); return t?`${v}｜${t}`:(vendorTeams(c['廠商']).length>1||tbl('合約管理').filter(k=>k['廠商名稱']===c['廠商']).length>1?`${v}｜未指定團隊`:v); };
  const laneOf = c => lane==='type'?c['卡片類型']: lane==='vendor'?vendLane(c):(c._v==='RM'?'版本里程碑':(c['負責人']||'（未指派）'));

  const items=[]; let undated=0;
  allCards().forEach(c=>{
    if(hideDone && isDone(c)) return;
    const s=parseD(c['開始日']), e=parseD(c['截止日']);
    if(!s && !e){ undated++; return; }
    items.push({lane:laneOf(c), type:c['卡片類型'], s, e, label:c['標題'], id:c['卡片ID'], done:isDone(c), stages:c._stages});
  });
  const visible = items.filter(it=>{ const a=it.s||it.e, b=it.e||it.s; return b>=start && a<=end; });

  const lanes={}, dayGroups={};
  visible.forEach(it=>{
    const single = !(it.stages&&it.stages.length) && !(it.s && it.e && daysBetween(it.s,it.e)>=1);
    if(single){ const k=it.lane+'|'+fmtD(it.e||it.s); (dayGroups[k]=dayGroups[k]||[]).push(it); }
    else (lanes[it.lane]=lanes[it.lane]||[]).push(it);
  });
  Object.values(dayGroups).forEach(g=>{
    const it = g.length===1 ? g[0] : {...g[0], label:`${g.length} 項：${g[0].label}…`, group:g.map(x=>x.id), done:g.every(x=>x.done)};
    (lanes[it.lane]=lanes[it.lane]||[]).push(it);
  });
  let order = Object.keys(lanes).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  if(lane==='type') order = TYPES.filter(t=>lanes[t]);
  order.forEach(k=>lanes[k].sort((a,b)=>((a.s||a.e)-(b.s||b.e))));

  // 刻度
  let ticks='';
  for(let d=new Date(start.getFullYear(),start.getMonth(),1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    if(d<start) continue;
    ticks+=`<div class="tl-tick" style="left:${pos(d)}%">${d.getFullYear()}/${d.getMonth()+1}</div>`;
  }
  if(scale!=='quarter'){
    let m=addDays(start,(8-(start.getDay()||7))%7);
    for(; m<=end; m=addDays(m,7)) ticks+=`<div class="tl-tick minor" style="left:${pos(m)}%">${md(m)}</div>`;
  }
  let grid='';
  for(let d=new Date(start.getFullYear(),start.getMonth()+1,1); d<=end; d=new Date(d.getFullYear(),d.getMonth()+1,1)) grid+=`<div class="tl-grid" style="left:${pos(d)}%"></div>`;

  const drawItem = it => {
    const cls = `c-${esc(it.type)}`, attr = it.group?`data-group="${esc(it.group.join(','))}"`:(it.id?`data-card="${esc(it.id)}"`:`data-rel="1"`);
    const title = esc(it.label);
    if(it.stages && it.stages.length){
      const cur=currentStage(it.stages);
      const lab=Math.min(Math.max(0,pos(it.s||it.e)),70);
      let h=`<div class="tl-lbl" ${attr} style="left:${lab}%">${title}${cur?`<span class="muted">｜目前：${esc(cur['作業階段'])}</span>`:''}</div>`;
      it.stages.forEach(st=>{
        const a=parseD(st['預計起日']), b=parseD(st['預計迄日'])||a; if(!a||b<start||a>end) return;
        const tip=esc(`${st['作業階段']}　${md(a)}${fmtD(a)!==fmtD(b)?'–'+md(b):''}　${st['階段狀態']||''}`);
        const k=`${stageDone(st)?'done':''} ${st===cur?'cur':''} ${stageLate(st)?'late':''}`;
        if(daysBetween(a,b)>=1){ const l=Math.max(0,pos(a)), r=Math.min(100,pos(addDays(b,1))); h+=`<div class="tl-seg ${cls} ${k}" ${attr} title="${tip}" style="left:${l}%;width:${Math.max(r-l,.4)}%"></div>`; }
        else h+=`<div class="tl-sdia ${cls} ${k}" ${attr} title="${tip}" style="left:calc(${pos(a)}% - 6px)"></div>`;
      });
      if(it.e) h+=`<div class="tl-golive ${cls}" ${attr} title="上線 ${esc(fmtD(it.e))}" style="left:calc(${pos(it.e)}% - 9px)"></div>`;
      return h;
    }
    if(it.s && it.e && daysBetween(it.s,it.e)>=1){
      const l=Math.max(0,pos(it.s)), r=Math.min(100,pos(addDays(it.e,1)));
      let h=`<div class="tl-bar ${cls} ${it.done?'done':''}" ${attr} title="${title}" style="left:${l}%;width:${Math.max(r-l,.6)}%">${title}</div>`;
      if(it.rel) h+=`<div class="tl-dia ${cls}" style="left:calc(${pos(it.e)}% - 8px)" title="上線 ${esc(fmtD(it.e))}"></div>`;
      return h;
    }
    const d=it.e||it.s;
    const mark = it.type==='Release' ? 'tl-dia':'tl-dot';
    return `<div class="${mark} ${cls}" ${attr} title="${title}" style="left:calc(${pos(d)}% - 8px);${it.done?'opacity:.5':''}"></div><div class="tl-lbl" ${attr} style="left:calc(${pos(d)}% + 14px)">${md(d)}　${title}</div>`;
  };
  const trackPx = Math.max(750, (($('#tab-timeline').clientWidth)||1100) - 152);
  const pxPct = px => px/trackPx*100;
  const pack = arr => { const rows=[]; arr.forEach(it=>{
      if(it.stages&&it.stages.length){ rows.push({rel:true,end:999,items:[it]}); return; }
      const lw=pxPct((String(it.label).length+6)*14.5+24);
      let x0, x1;
      if(it.s && it.e && daysBetween(it.s,it.e)>=1){ x0=Math.max(0,pos(it.s)); x1=Math.max(pos(addDays(it.e,1)), x0+lw); }
      else { x0=pos(it.e||it.s)-1; x1=x0+lw; }
      const r=rows.find(r=>!r.rel && r.end<x0-0.5); if(r){ r.items.push(it); r.end=x1; } else rows.push({rel:false,end:x1,items:[it]});
    }); return rows; };
  const lanesHtml = order.map(k=>`<div class="tl-lane"><div class="tl-lname">${esc(k)}<div class="muted" style="font-size:13px;font-weight:400">${lanes[k].length} 項</div></div><div class="tl-track">${grid}${pack(lanes[k]).map(r=>`<div class="tl-row ${r.rel?'rel':''}">${r.items.map(drawItem).join('')}</div>`).join('')}</div></div>`).join('');
  const todayPos = pos(TODAY);

  $('#tab-timeline').innerHTML = `
  <div class="toolbar">
    <span class="label">泳道</span>
    <div class="seg" id="laneSeg">${[['vendor','廠商｜團隊'],['type','卡片類型'],['owner','負責人']].map(([k,t])=>`<button data-k="${k}" class="${lane===k?'on':''}">${t}</button>`).join('')}</div>
    <span class="label" style="margin-left:8px">尺度</span>
    <div class="seg" id="scaleSeg">${Object.entries(SCALES).map(([k,v])=>`<button data-k="${k}" class="${scale===k?'on':''}">${v.label}</button>`).join('')}</div>
    <button class="sm" id="tlPrev">◀</button><button class="sm" id="tlToday">今天</button><button class="sm" id="tlNext">▶</button>
    <label class="row" style="gap:6px;font-size:15px"><input type="checkbox" id="hideDone" ${hideDone?'checked':''}> 隱藏已完成</label>
    <span class="sp"></span>
    <button class="primary" id="tlNew">＋ 新增卡片</button>
  </div>
  <div class="legend" style="margin-bottom:10px">
    ${TYPES.map(t=>`<span class="tag T-${t}">${t}</span>`).join('')}
    <span class="muted">長條＝有起訖　●＝單日截止　Release 列＝各作業階段，亮框為目前階段，實心◆＝上線</span>
    ${undated?`<span class="muted">・另有 ${undated} 張沒有日期，不顯示</span>`:''}
  </div>
  <div class="tl"><div class="tl-inner">
    <div class="tl-head"><div style="padding:10px;font-weight:700;border-right:1.5px solid var(--line)">${fmtD(start).slice(5)} ～ ${fmtD(end).slice(5)}</div><div class="tl-scale">${ticks}${todayPos>=0&&todayPos<=100?`<div class="tl-todaylbl ${scale==='quarter'?'q':''}" style="left:${todayPos}%">今天 ${md(TODAY)}</div>`:''}</div></div>
    <div style="position:relative">
      ${lanesHtml || emptyX('cards','這段期間沒有卡片')}
      ${todayPos>=0&&todayPos<=100?`<div style="position:absolute;top:0;bottom:0;left:150px;right:0;pointer-events:none"><div class="tl-today" style="left:${todayPos}%"></div></div>`:''}
    </div>

/** 維修單的「原本故障原因」：故障類別 + 描述（描述已含各次故障的日期、局名、機台與現象） */
function ticketSeed(c){
  if(!c || c['卡片類型']!=='維修單') return '';
  const t=[]; if(String(c['故障類別']||'').trim()) t.push('故障類別：'+String(c['故障類別']).trim());
  if(String(c['描述']||'').trim()) t.push('故障原因／現象：\n'+String(c['描述']).trim());
  return t.join('\n');
}
const hasAnyProgress = id => S.Progress_Log.some(x=>x['卡片ID']===id && String(x['本週進展']).trim());
/** 維修單首次進水池：把故障原因直接存成本週進展（可再修改），週報才有內容 */
async function seedTicket(id){
  const c=cardById(id), s=ticketSeed(c); if(!s || hasAnyProgress(id) || progOf(CUR_WEEK,id)) return;
  const row={週別:CUR_WEEK,卡片ID:id,狀態:c['狀態'],本週進展:s,風險與協同:'',下週預計:'',寫入時間:nowISO()};
  S.Progress_Log.push(row);
  await persist('saveProgress',{rows:[row]});
}
async function addToPool(id){
  const wk=CUR_WEEK, ids=poolIds(wk); if(ids.includes(id)) return;
  await seedTicket(id);
  ids.push(id); await setPool(wk,ids);
}
async function placeInPool(id, beforeId){
  const wk=CUR_WEEK; let ids=poolIds(wk); const had=ids.includes(id);
  if(beforeId===id) return;
  ids=ids.filter(x=>x!==id);
  const at=beforeId?ids.indexOf(beforeId):-1;
  if(at>=0) ids.splice(at,0,id); else ids.push(id);
  if(had && ids.join()===poolIds(wk).join()) return;
  if(!had) await seedTicket(id);
  await setPool(wk,ids);
  if(!had) toast(ticketSeed(cardById(id))?'已加入本週水池，並帶入故障原因（可修改）':'已加入本週水池');
}
function endDrag(){
  document.body.classList.remove('dragging-lib');
  $$('.dragging').forEach(x=>x.classList.remove('dragging'));
  $$('.drop.over').forEach(x=>x.classList.remove('over'));
  $$('.pcard.drop-before').forEach(x=>x.classList.remove('drop-before'));
}
document.addEventListener('dragend', endDrag);
async function removeFromPool(id){
  const wk=CUR_WEEK; const p=progOf(wk,id);
  if(p && String(p['本週進展']).trim() && !confirm('這張卡本週已寫了進度，移出水池後週報不會包含它（進度紀錄仍保留）。確定移出？')) return;
  await setPool(wk, poolIds(wk).filter(x=>x!==id));
}
async function setPool(wk, ids){
  S.Weekly_Pool = S.Weekly_Pool.filter(p=>p['週別']!==wk).concat(ids.map((id,i)=>({週別:wk,卡片ID:id,排序:i+1,加入時間:nowISO()})));
  renderPool();
  await persist('setPool',{week:wk,cardIds:ids});
}
async function saveProgress(ids){
  const wk=CUR_WEEK, rows=[], cards=[];
  for(const id of ids){
    const c=cardById(id), k=`${wk}|${id}`, p=progOf(wk,id)||{}, d=draft[k]; if(!d) continue;
    if(!String(d['本週進展']).trim()){ toast(`「${c['標題']}」的本週進展是必填`, true); return; }
    const row={週別:wk,卡片ID:id,狀態:d['狀態'],本週進展:d['本週進展'].trim(),風險與協同:d['風險與協同'].trim(),下週預計:d['下週預計'].trim(),寫入時間:nowISO()};
    const i=S.Progress_Log.findIndex(x=>x['週別']===wk&&x['卡片ID']===id);
    if(i>=0) S.Progress_Log[i]=row; else S.Progress_Log.push(row);
    rows.push(row);
    if(c['狀態']!==d['狀態']){ c['狀態']=d['狀態']; c['更新時間']=nowISO(); c['結案時間']=DONE.has(c['狀態'])?(c['結案時間']||nowISO()):''; cards.push(c); }
    delete draft[k];
  }
  if(!rows.length){ toast('沒有需要儲存的變更'); return; }
  renderPool();
  const ok = await persist('saveProgress',{rows});
  const real=cards.filter(c=>!c._v), virt=cards.filter(c=>c._v);
  if(real.length) await persist('saveCards',{rows:real});
  for(const c of virt) await saveVirtualStatus(c);
  if(ok) toast(`已儲存 ${rows.length} 張`);
}

/* ---- 週報 ---- */
function buildReport(wk){
  const pool=poolIds(wk);
  const logs=S.Progress_Log.filter(p=>p['週別']===wk && cardById(p['卡片ID']));
  logs.sort((a,b)=>{const ia=pool.indexOf(a['卡片ID']), ib=pool.indexOf(b['卡片ID']); return (ia<0?999:ia)-(ib<0?999:ib);});
  // 先版本、再 RQ：有版本ID的卡歸入「◆ 版本」，其下依關聯單號(RQ)聚合；沒有版本的維持「◆ RQ」
  const verLabel = ver => {
    const rms=tbl('Release_Master').filter(r=>String(r['版本ID'])===ver);
    const names=rms.map(r=>{const t=teamOfCard({廠商:r['廠商名稱'],合約ID:r['合約ID'],_v:'RM',_row:r}); return `${r['軟體版號']}（${shortVendor(r['廠商名稱'])}${t?' '+t:''}）`;}).join('、');
    return `版本 ${ver}${names?'　'+names:''}`;
  };
  const sec = field => {
    const groups=new Map(); // 群組key -> {ver, rqs:Map(rqKey -> [{c,l}])}
    logs.filter(l=>String(l[field]||'').trim()).forEach(l=>{
      const c=cardById(l['卡片ID']); const ver=String(c['版本ID']||'').trim(), isRM=c['_v']==='RM';
      const rq=isRM?'@ver':(String(c['關聯單號']||'').trim()||('#'+c['卡片ID']));
      const gk=ver?('V:'+ver):('R:'+rq);
      if(!groups.has(gk)) groups.set(gk,{ver,rqs:new Map()});
      const g=groups.get(gk); if(!g.rqs.has(rq)) g.rqs.set(rq,[]); g.rqs.get(rq).push({c,l});
    });
    if(!groups.size) return '（無）';
    const ind = (t,pad) => String(t).trim().replace(/\n/g,'\n'+pad);
    const one = ({c,l},head,pad) => `${head}${c['標題']}【${l['狀態']}】\n${pad}${ind(l[field],pad)}`;
    return [...groups.values()].map(g=>{
      if(!g.ver){ // 沒有版本：維持原本「◆ RQ」格式
        const [key,arr]=[...g.rqs.entries()][0]; const ref=key.startsWith('#')?'':key;
        if(arr.length===1) return one(arr[0],`◆ ${ref?ref+'｜':''}`,'　　');
        return `◆ ${ref}\n`+arr.map(x=>one(x,'　・','　　')).join('\n');
      }
      const lines=[...g.rqs.entries()].map(([rq,arr])=>{
        const ref = rq==='@ver'?'版本整體':(rq.startsWith('#')?'':rq);
        if(arr.length===1) return one(arr[0],`　▸ ${ref?ref+'｜':''}`,'　　');
        return `　▸ ${ref}\n`+arr.map(x=>one(x,'　　・','　　　')).join('\n');
      });
      return `◆ ${verLabel(g.ver)}\n`+lines.join('\n');
    }).join('\n\n');
  };
  const m=weekStart(wk);
  const text = `【週報】${wk}（${fmtD(m)} ～ ${fmtD(addDays(m,6))}）\n\n一、本週關鍵進展\n${sec('本週進展')}\n\n二、風險與協同事項\n${sec('風險與協同')}\n\n三、下週預計推展\n${sec('下週預計')}\n`;
  const ctx = logs.map(l=>{const c=cardById(l['卡片ID']); return `- ${c['版本ID']?'版本'+c['版本ID']+'｜':''}${c['_v']==='RM'?'版本整體':(c['關聯單號']||'（無單號）')}｜${c['標題']}｜類型:${c['卡片類型']}｜廠商:${c['廠商']||'-'}｜負責:${c['負責人']||'-'}｜狀態:${l['狀態']}｜截止:${String(c['截止日']||'-').slice(0,10)}`;}).join('\n');
  return {text, ctx, count:logs.length};
}
function mgmtPanel(wk){
  const m=mgmtItems(wk), pr=m.done.length?mgmtPrompt(m.done.map(x=>x.block)):'';

function catOf(row){
  const ov=ls.get(LS.catOverride,{}); if(ov[row.id]) return ov[row.id];
  const t=(row.description||'')+' '+(row.vendorAnalysis||'')+' '+(row.solution||'');
  for(const c of FAULT_CATS) if(c.kw.some(k=>t.includes(k))) return c.name;
  return OTHER_CAT;
}
const isMoneyCat = n => !!(FAULT_CATS.find(c=>c.name===n)||{}).money;
const mcode = r => `${r.poCode}-${r.machineNo}`;
const atmDate = s => { const d=new Date(s); return isNaN(d)?null:d; };

function computeAlerts(){
  const rows=ATM.rows.map(r=>({...r, cat:catOf(r), code:mcode(r), vend:shortVendor(r.vendor), t:atmDate(r.issueTime)})).filter(r=>r.t);
  const since60=addDays(TODAY,-60), recent=rows.filter(r=>r.t>=since60);
  const alerts=[];
  const group=(arr,keyFn)=>{const m=new Map(); arr.forEach(r=>{const k=keyFn(r); if(!m.has(k)) m.set(k,[]); m.get(k).push(r);}); return m;};
  // 1a 同廠商跨機台
  group(recent,r=>r.vend+'|'+r.cat).forEach((arr,k)=>{
    if(arr.length>=3 && new Set(arr.map(r=>r.code)).size>=2){
      alerts.push({rule:'1a', label:'1a 同廠商跨機台 60 天同類 ≥3 次', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
        title:`${arr[0].vend} ${arr[0].cat}跨局反覆發生（${new Set(arr.map(r=>r.code)).size} 台、${arr.length} 次）`});
    }
  });
  // 1b 單機台
  group(recent,r=>r.code+'|'+r.cat).forEach((arr,k)=>{
    if(arr.length>=3) alerts.push({rule:'1b', label:'1b 同機台 60 天同類 ≥3 次', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
      title:`${arr[0].poName} ${arr[0].code} ${arr[0].cat} ${arr.length} 次`});
  });
  // 2 帳務／客戶權益
  group(recent.filter(r=>isMoneyCat(r.cat)),r=>r.code+'|'+r.cat).forEach((arr,k)=>{
    alerts.push({rule:'2', label:'2 帳務／客戶權益 1 次即開', key:k, vend:arr[0].vend, cat:arr[0].cat, cases:arr,
      title:`${arr[0].poName} ${arr[0].code} ${arr[0].cat}`});
  });
  // 3 反覆維修
  group(rows,r=>r.code).forEach((arr,code)=>{
    arr.sort((a,b)=>a.t-b.t);
    const hits=[];
    for(let i=1;i<arr.length;i++){
      const prev=arr[i-1], rt=atmDate(prev.resolveTime);
      if(prev.status==='已結案' && rt && arr[i].t>=rt && daysBetween(rt,arr[i].t)<=30 && arr[i].t>=since60) hits.push(`${md(rt)} 結案後 ${daysBetween(rt,arr[i].t)} 天再故障`);
    }
    arr.forEach(r=>{ const n=(r.logs||[]).filter(l=>/到場|派員|到府|現場維修/.test(l.note||'')).length; if(n>=2 && r.t>=since60) hits.push(`同案廠商到場 ${n} 次`); });
    if(hits.length) alerts.push({rule:'3', label:'3 反覆維修', key:code, vend:arr[0].vend, cat:arr[arr.length-1].cat, cases:arr.filter(r=>r.t>=since60), reason:hits,
      title:`${arr[arr.length-1].poName} ${code} 修完又壞`});
  });
  // 對應既有維修單
  const tickets=S.Cards.filter(c=>c['卡片類型']==='維修單');
  alerts.forEach(a=>{
    const codes=new Set(a.cases.map(r=>r.code));
    // 合併過的卡，來源ID 會是「ATM-1a-X; ATM-2-Y」多筆，類別也可能是「吃卡、綠屏」
    a.ticket = tickets.find(c=>String(c['來源ID']).split(/\s*;\s*/).includes(`ATM-${a.rule}-${a.key}`))
      || tickets.find(c=>!isDone(c) && String(c['故障類別']).split('、').includes(a.cat) && parseJSON(c['機台清單'],[]).some(m=>codes.has(m.machine)));
  });
  const rank={'2':0,'1a':1,'3':2,'1b':3};
  return alerts.sort((a,b)=>(!!a.ticket-!!b.ticket)||(rank[a.rule]-rank[b.rule]));
}
/** 維修單觀察期再發：機台在卡片進入觀察期之後又有故障 */
function reoccur(c){
  if(!c || c['卡片類型']!=='維修單' || c['狀態']!=='觀察期') return [];
  const since=new Date(c['更新時間']||0), codes=new Set(parseJSON(c['機台清單'],[]).map(m=>m.machine));
  return ATM.rows.filter(r=>codes.has(mcode(r)) && atmDate(r.issueTime)>since).map(r=>`${mcode(r)} ${md(atmDate(r.issueTime))} ${r.description.slice(0,30)}`);
}

/* =========================================================
   沿用格式的五張表：Release_Master / Release_Stages / 合約管理 / 合約定期事項 / 資安與專案排程
   ========================================================= */
const TBL_PREFIX = {'Release_Master':'RM','Release_Stages':'RS','合約管理':'CT','合約定期事項':'CR','資安與專案排程':'SP'};
const RM_ST = ['未開始','進行中','進行中 (財金跨機構試營運)','已完成','規劃中','規劃中 (待啟動)'];
const RS_ST = ['未開始','進行中','進行中 (財金跨機構試營運)','待驗收','已完成','延遲','規劃中','規劃中 (待啟動)'];
const CT_ST = ['履約中','即將到期','已到期'];
const CR_VENDOR = ['三商電腦','迪堡多富資訊','國眾電腦','行內自維','共通廠商'];
const CR_SYS_EXTRA = ['共通性維運','開放式系統','自提機及跨行系統'];
const CR_FREQ = ['每月','每季','每半年','每年','專案里程碑','不定期'];
const CR_CAT = ['廠商請款','交付文件','資安查核','教育訓練','系統維運','廠商管理','帳號與個資','評估演練'];
const SP_KIND = ['資安查核','系統維運','教育訓練','廠商管理','評估演練','帳號與個資','專案里程碑','交付文件'];
const SP_FREQ = ['每月','每季','每半年','每年','不定期','專案里程碑'];
const SP_ST = ['未開始','進行中','待審核','已完成','例行監控'];
const ds = v => fmtD(parseD(v));
const tbl = name => (S[name] = S[name] || []);
function nextRowId(name){
  let max=0; tbl(name).forEach(r=>{ const m=String(r['列ID']||'').match(/-(\d+)$/); if(m) max=Math.max(max,Number(m[1])); });
  return `${TBL_PREFIX[name]}-${String(max+1).padStart(3,'0')}`;
}
async function saveRow(name, row, msg){
  if(!row['列ID']) row['列ID']=nextRowId(name);
  const arr=tbl(name), i=arr.findIndex(r=>r['列ID']===row['列ID']);
  if(i>=0) arr[i]=row; else arr.push(row);
  _vc=null;
  return persist('saveRows',{sheet:name,rows:[row]},msg);
}
async function deleteRows(name, ids, msg){
  S[name]=tbl(name).filter(r=>!ids.includes(r['列ID'])); _vc=null;
  return persist('deleteRows',{sheet:name,ids},msg);
}
const ROC = d => `${d.getFullYear()-1911}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
function autoPeriodText(s,e){
  const a=parseD(s), b=parseD(e); if(!a&&!b) return '';
  if(!a||!b||fmtD(a)===fmtD(b)) return `${ROC(a||b)} (1 天)`;
  return `${ROC(a)} - ${ROC(b)} (${daysBetween(a,b)+1} 天)`;
}

/* ---- 虛擬卡片：Release 版本與資安排程直接由原表產生，狀態寫回原表 ---- */
let _vc=null;
const rmToCard = s => { s=String(s||''); return s.includes('已完成')?'已完成':(s.includes('規劃')||s.includes('未開始')||!s)?'待處理':'進行中'; };
const spToCard = s => ({'未開始':'待處理','待審核':'等回覆','已完成':'已完成'})[s] || (s?'進行中':'待處理');
function cardToRm(c, cur){ if(rmToCard(cur)===c) return cur; return {已完成:'已完成',待處理:'規劃中',進行中:'進行中',等回覆:'進行中'}[c]||cur; }
function cardToSp(c, cur){ if(spToCard(cur)===c) return cur; return {已完成:'已完成',待處理:'未開始',進行中:'進行中',等回覆:'待審核'}[c]||cur; }
const stagesOf = rm => tbl('Release_Stages').filter(s=>String(s['版本ID'])===String(rm['版本ID']) && s['廠商名稱']===rm['廠商名稱'])
  .sort((a,b)=>(parseD(a['預計起日'])||9e15)-(parseD(b['預計起日'])||9e15));
function currentStage(stages){
  return stages.find(s=>{const a=parseD(s['預計起日']), b=parseD(s['預計迄日'])||a; return a && a<=TODAY && TODAY<=b && !String(s['階段狀態']).includes('已完成');})
      || stages.find(s=>!String(s['階段狀態']).includes('已完成') && (parseD(s['預計起日'])||TODAY)>=TODAY)
      || stages.find(s=>!String(s['階段狀態']).includes('已完成'));
}
function virtualCards(){
  if(_vc) return _vc;
  const rm = tbl('Release_Master').filter(r=>r['列ID']).map(r=>{
    const st=stagesOf(r), starts=st.map(s=>parseD(s['預計起日'])).filter(Boolean);
    const first=starts.length?new Date(Math.min(...starts)):parseD(r['預計交版日']);
    const tm=teamOfCard({廠商:r['廠商名稱'],合約ID:r['合約ID'],_v:'RM',_row:r});
    return {...Object.fromEntries(CARD_FIELDS.map(f=>[f,''])),
      卡片ID:'RM:'+r['列ID'], 卡片類型:'Release', 區塊分類:'軟體版本更新', 標題:`${r['軟體版號']} 版更｜${shortVendor(r['廠商名稱'])}${tm?' '+tm:''}（${r['版本ID']}）`, 合約ID:String(r['合約ID']||''),
      關聯單號:String(r['版本ID']), 廠商:r['廠商名稱'], 狀態:rmToCard(r['整體狀態']), 開始日:fmtD(first), 截止日:ds(r['預計上線日']),
      版本ID:String(r['版本ID']), 描述:r['備註']||'', 來源:'Release_Master', 來源ID:r['列ID'], _v:'RM', _row:r, _stages:st};
  });
  const sp = tbl('資安與專案排程').filter(r=>r['列ID']).map(r=>({...Object.fromEntries(CARD_FIELDS.map(f=>[f,''])),
      卡片ID:'SP:'+r['列ID'], 卡片類型:'資安專案', 區塊分類:r['事項性質']||'資安合規', 標題:r['作業事項名稱'], 關聯單號:r['檢核代碼']||'',
      負責人:r['主責同仁']||'', 狀態:spToCard(r['作業階段']), 開始日:ds(r['預計起日']), 截止日:ds(r['預計迄日']),
      描述:[r['適用範圍/系統'],r['協同人員/股別']&&('協同：'+r['協同人員/股別']),r['交付成果與備註']].filter(Boolean).join('\n'),
      來源:'資安與專案排程', 來源ID:r['列ID'], _v:'SP', _row:r}));
  return (_vc = rm.concat(sp));
}
/* ---- 維護團隊（ATM／DMS）：由合約管理的「維護團隊」帶出 ---- */
function teamOfContract(id){ const k=tbl('合約管理').find(x=>String(x['列ID'])===String(id)); return k?String(k['維護團隊']||'').trim():''; }
function vendorTeams(v){ return [...new Set(tbl('合約管理').filter(k=>k['廠商名稱']===v).map(k=>String(k['維護團隊']||'').trim()).filter(Boolean))]; }
function teamOfCard(c){
  const row=c._row||{};
  let t=teamOfContract(c['合約ID']||row['合約ID']||'');
  if(!t){ const ts=vendorTeams(String(c['廠商']||row['廠商名稱']||'').trim()); if(ts.length===1) t=ts[0]; }          // 該廠商只有一種團隊
  if(!t && c._v==='RM'){ const s=String(row['涵蓋單號清單']||'').toUpperCase(); const ts=vendorTeams(row['廠商名稱']); const g=ts.find(x=>s.includes(x.toUpperCase())); if(g) t=g; } // 涵蓋單號含 ATM／DMS
  return t;
}
const allCards = () => S.Cards.concat(virtualCards());
async function saveVirtualStatus(c){
  if(c._v==='RM'){ const r={...c._row, 整體狀態:cardToRm(c['狀態'], c._row['整體狀態'])}; return saveRow('Release_Master', r); }
  if(c._v==='SP'){ const r={...c._row, 作業階段:cardToSp(c['狀態'], c._row['作業階段'])}; return saveRow('資安與專案排程', r); }
}

/* ---- 合約與合約季 ---- */
function addMonths(d,n){ const y=d.getFullYear(), m=d.getMonth()+n; const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(d.getDate(),last)); }
function contractMonths(k){
  const t=String(k['簽約週期']||''); let m=t.match(/(\d+(?:\.\d+)?)\s*年/); if(m) return Math.round(Number(m[1])*12);
  m=t.match(/(\d+)\s*個?月/); if(m) return Number(m[1]);
  const a=parseD(k['契約起日']), b=parseD(k['契約迄日']); if(a&&b) return Math.max(1,Math.round(daysBetween(a,b)/30.44));
  return 24;
}
function contractEnd(k){ const e=parseD(k['契約迄日']); if(e) return e; const s=parseD(k['契約起日']); return s?addMonths(s,contractMonths(k)):null; }
const contractOf = sys => tbl('合約管理').find(k=>k['合約名稱']===sys);
function contractQuarter(k, d=TODAY){
  const cs=parseD(k['契約起日']); if(!cs) return null; const n=Math.ceil(contractMonths(k)/3);
  for(let q=1;q<=n;q++){ const a=addMonths(cs,3*(q-1)), b=addDays(addMonths(cs,3*q),-1); if(d>=a&&d<=b) return {q,a,b,n}; }
  return null;
}

/* ---- 產卡規則 ---- */
function holidayMap(){ const m={}; S.Holidays.forEach(h=>{ const d=ds(h['日期']); if(d) m[d]=h['類型']||'假日'; }); return m; }
function isWorkday(d, hm){ const k=fmtD(d); if(hm[k]==='補班') return true; if(hm[k]) return false; const w=d.getDay(); return w!==0&&w!==6; }
function prevWorkday(d, hm){ let x=new Date(d); for(let i=0;i<20&&!isWorkday(x,hm);i++) x=addDays(x,-1); return x; }
function dayIn(y,m,day){ const last=new Date(y,m+1,0).getDate(); return new Date(y,m, day==='末'?last:Math.min(Number(day),last)); }
const normRule = r => String(r||'').trim().toUpperCase().replace(/：/g,':').replace(/\s/g,'');
function validRule(rule){ return /^(W:[1-7]|M:(\d{1,2}|末)|Q:(\d{1,2}|末)|Q:[1-3]:(\d{1,2}|末)|H:(\d{1,2}|末)|Y:[\d,]+:(\d{1,2}|末)|2Y:[\d,]+:(\d{1,2}|末)|CQ:(\*|[\d,]+):(末|\+\d+)|ONCE:\+\d+)$/.test(normRule(rule)); }
const needsContract = rule => /^(CQ|ONCE|2Y):/.test(normRule(rule));
/** 回傳 [{date, period}]；ctx 提供合約起日與月數 */
function ruleDates(rule, from, until, ctx={}){
  const out=[]; const r=normRule(rule); const p=r.split(':');
  const push=(d,per)=>{ if(d>=from && d<=until) out.push({date:d,period:per}); };
  const y0=from.getFullYear(), y1=until.getFullYear();
  if(p[0]==='W'){ const wd=Number(p[1])%7; let d=addDays(from,(wd-from.getDay()+7)%7); for(;d<=until;d=addDays(d,7)) push(d,workWeek(d)); }
  else if(p[0]==='M'){ for(let y=y0;y<=y1;y++) for(let m=0;m<12;m++) push(dayIn(y,m,p[1]),`${y}-${pad(m+1)}`); }
  else if(p[0]==='Q'){ const mi=p.length>=3?Number(p[1]):3, day=p.length>=3?p[2]:p[1]; for(let y=y0;y<=y1;y++) for(let q=0;q<4;q++) push(dayIn(y,q*3+mi-1,day),`${y}-Q${q+1}`); }
  else if(p[0]==='H'){ const day=p[1]||'末'; for(let y=y0;y<=y1;y++){ push(dayIn(y,5,day),`${y}-H1`); push(dayIn(y,11,day),`${y}-H2`); } }
  else if(p[0]==='Y'||p[0]==='2Y'){ const months=String(p[1]||'').split(',').map(Number).filter(Boolean), day=p[2]||'末', anchor=ctx.cs?ctx.cs.getFullYear():y0;
    for(let y=y0;y<=y1;y++){ if(p[0]==='2Y' && (y-anchor)%2!==0) continue; months.forEach(m=>push(dayIn(y,m-1,day),months.length>1?`${y}-${pad(m)}`:`${y}`)); } }
  else if(p[0]==='CQ' && ctx.cs){ const n=Math.ceil((ctx.months||24)/3), list=p[1]==='*'?null:p[1].split(',').map(Number);
    for(let q=1;q<=n;q++){ if(list && !list.includes(q)) continue; const qe=addDays(addMonths(ctx.cs,3*q),-1); push(p[2]==='末'?qe:addDays(qe,Number(p[2].slice(1))),`合約Q${q}`); } }
  else if(p[0]==='ONCE' && ctx.cs){ push(addDays(ctx.cs,Number(p[1].slice(1))),'一次性'); }
  return out.sort((a,b)=>a.date-b.date);
}
const crEnabled = r => !(r['啟用監控']===false || String(r['啟用監控']).toUpperCase()==='FALSE');
/** 某一筆合約定期事項接下來 n 期的截止日（已遇假日提前） */
function nextDues(r, n=3){
  const rule=r['產卡規則']; if(!validRule(rule)) return {list:[], err: rule?'規則格式錯誤':''};
  const k=contractOf(r['合約系統']);
  if(needsContract(rule) && !k) return {list:[], err:'找不到對應合約（合約系統需與合約名稱相同）'};
  const cs=k?parseD(k['契約起日']):null, ce=k?contractEnd(k):null, hm=holidayMap();
  const from=new Date(Math.max(cs||0, addDays(TODAY,-7)));
  const isCQ=/^(CQ|ONCE)/.test(normRule(rule));
  const until=isCQ?addDays(TODAY,365*6):new Date(Math.min(ce||addDays(TODAY,365*5), addDays(TODAY,365*5)));
  const list=ruleDates(rule, from, until, {cs, months:k?contractMonths(k):24}).map(x=>({...x, due:prevWorkday(x.date,hm)})).filter(x=>x.due>=addDays(TODAY,-7)).slice(0,n);
  return {list, k};
}
async function genRecurring(silent){
  const have=new Set(S.Cards.map(c=>c['來源']+'|'+c['來源ID'])), add=[];
  tbl('合約定期事項').forEach(r=>{
    if(!crEnabled(r) || !r['列ID']) return;
    const {list,k}=nextDues(r,3);
    list.forEach(x=>{
      const sid=`${r['列ID']}|${x.period}`; if(have.has('合約定期|'+sid)) return; have.add('合約定期|'+sid);
      const moved=fmtD(x.due)!==fmtD(x.date);
      add.push(blankCard({卡片類型:'定期事項',區塊分類:r['項目分類']||'',標題:`${r['應辦事項名稱']}（${x.period}）`,
        廠商:['行內自維','共通廠商'].includes(r['負責廠商'])?'':(r['負責廠商']||''),截止日:fmtD(x.due),合約ID:k?k['列ID']:'',
        來源:'合約定期',來源ID:sid,期別:x.period,
        描述:[`${r['合約系統']||''}｜${r['執行時程']||''}｜規則 ${r['產卡規則']}${moved?`｜原訂 ${fmtD(x.date)} 遇假日提前`:''}`,
              r['交付文件與查核表單']&&('交付：'+r['交付文件與查核表單']), r['權責分工']&&('權責：'+r['權責分工']), r['檢核說明與罰則要點']].filter(Boolean).join('\n')}));
    });
  });
  if(add.length){ S.Cards.push(...add); await persist('importCards',{rows:add}, silent?`已自動產生 ${add.length} 張定期卡`:null); }
  if(!silent) toast(add.length?`新增 ${add.length} 張定期卡`:'定期卡都已是最新，沒有新增');
  return add.length;
}

【cards 每筆欄位】（全部用字串）
- 卡片類型：專案｜資安專案｜定期事項｜Release｜維修單（判斷不出來用「專案」）
- 區塊分類：硬體維護｜軟體版本更新｜網路連線｜資安合規｜現金管理/清算｜耗材更換｜系統監控｜應變演練
- 標題：必填，40 字內，可用「[分類/廠商]」前綴
- 關聯單號：RQ／CR／SR 單號或版號；沒有就留空
- 廠商：三商電腦｜國眾電腦｜迪堡多富資訊，或原文出現的廠商全名
- 負責人、狀態（待處理｜進行中｜等回覆｜已完成）
- 開始日、截止日：YYYY-MM-DD。民國年轉西元（115/11/12 → 2026-11-12）。只有一個日期就放截止日
- 版本ID（例如 1160215）、描述（保留原文重點與細節）
- 來源：資料出處，例如「主管交辦」「會議紀錄」「雜事系統」「Email」
- 來源ID：原系統的唯一編號；沒有就用「來源縮寫-日期-序號」，例如 MAIL-20261110-01。同一件事每次轉換必須產生相同的來源ID

【注意】
- 不要編造原文沒有的日期、單號、人名；不確定就留空
- 一件事一張卡，不要把不同事項合併

以下是要轉換的文字：
`;
const TEMPLATE = {cards:[{卡片類型:'專案',區塊分類:'軟體版本更新',標題:'[需求評估] 範例：跨行轉帳戶名列印位置調整',關聯單號:'RQ100000000',廠商:'三商電腦',負責人:'宏全',狀態:'進行中',開始日:'2026-11-10',截止日:'2026-12-15',版本ID:'',描述:'',來源:'主管交辦',來源ID:'MAIL-20261110-01'}]
};
let IMP=null;
function renderImport(){
  $('#tab-import').innerHTML=`
  <div class="two">
    <div class="panel">
      <h3>貼上 JSON 或選擇檔案</h3>
      <textarea id="impText" rows="14" class="mono" placeholder='{"cards":[...]}'></textarea>
      <div class="row" style="margin-top:8px"><input type="file" id="impFile" accept=".json,application/json"><span class="sp"></span><button class="primary" id="impCheck">檢查並預覽</button></div>
      <div id="impPrev" style="margin-top:14px">${emptyX('imp','貼上 JSON 後按「檢查並預覽」',1)}</div>
    </div>
    <div class="panel">
      <h3>產生 JSON 的方式</h3>
      <ol style="margin:0 0 12px;padding-left:20px">
        <li>按「複製 AI 轉 JSON 提示詞」，貼到 Gemini 或 Claude</li>
        <li>在提示詞後面貼上會議紀錄、Email，或雜事系統／其他系統匯出的內容</li>
        <li>把 AI 回覆的 JSON 貼到左邊，按「檢查並預覽」</li>
      </ol>
      <div class="row"><button id="cpAi">複製 AI 轉 JSON 提示詞</button><button id="cpTpl">複製 JSON 範本</button></div>
      <div class="warnbox" style="margin-top:12px">重複判斷：同一個「來源＋來源ID」已存在就跳過，不會更新舊卡；沒有來源ID 的卡片以標題判斷。合約、版本、資安排程請到各自分頁直接編輯。</div>
      <div class="muted" style="font-size:14px">ATM 故障不需要匯入，網頁會直接讀取 ATM Tracker；需要追蹤的請到「ATM 參考」開立維修單。</div>
    </div>
  </div>`;
  $('#cpAi').onclick=()=>copy(AI_PROMPT,'提示詞已複製');
  $('#cpTpl').onclick=()=>copy(JSON.stringify(TEMPLATE,null,2),'範本已複製');
  $('#impFile').onchange=async e=>{ const f=e.target.files[0]; if(f){ $('#impText').value=await f.text(); checkImport(); } };
  $('#impCheck').onclick=checkImport;
}
function checkImport(){
  const box=$('#impPrev'); let raw=$('#impText').value.trim().replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  let j; try{ j=JSON.parse(raw); }catch(e){ box.innerHTML=`<div class="warnbox">JSON 格式錯誤：${esc(e.message)}</div>`; return; }
  const cardsIn = Array.isArray(j)?j:(j.cards||[]), contractsIn = [];
  const have=new Set(S.Cards.map(c=>c['來源']+'|'+c['來源ID'])), seen=new Set();
  const res={add:[],skip:[],err:[],kAdd:[],kSkip:[]};
  cardsIn.forEach((o,i)=>{
    const errs=[]; const c=blankCard({來源:'匯入'});
    CARD_FIELDS.forEach(f=>{ if(o[f]!==undefined && o[f]!==null && f!=='卡片ID') c[f]=typeof o[f]==='object'?JSON.stringify(o[f]):String(o[f]).trim(); });
    if(!c['標題']) errs.push('缺標題');
    if(!TYPES.includes(c['卡片類型'])) { errs.push(`卡片類型「${c['卡片類型']}」不在清單，已改為專案`); c['卡片類型']='專案'; }
    if(!statusList(c['卡片類型']).includes(c['狀態'])) c['狀態']=statusList(c['卡片類型'])[0];
    ['開始日','截止日'].forEach(f=>{ if(c[f] && !parseD(c[f])) { errs.push(`${f}「${c[f]}」格式錯誤，已清空`); c[f]=''; } });
    if(!c['來源ID']) c['來源ID']='T:'+c['標題'];
    const key=c['來源']+'|'+c['來源ID'];
    if(!c['標題']) res.err.push({i:i+1,msg:errs.join('；')});
    else if(have.has(key)||seen.has(key)) res.skip.push(c);
    else { seen.add(key); res.add.push({c,warn:errs}); }
  });
  contractsIn.forEach(k=>{
    const kk={合約ID:String(k['合約ID']||'').trim(),合約名稱:String(k['合約名稱']||'').trim(),廠商:k['廠商']||'',起日:k['起日']||'',迄日:k['迄日']||'',備註:k['備註']||'',定期義務:JSON.stringify(Array.isArray(k['定期義務'])?k['定期義務']:parseJSON(k['定期義務'],[]))};
    if(!kk['合約ID']||!kk['合約名稱']) res.err.push({i:'合約',msg:'合約缺少合約ID或名稱'});
    else res.kAdd.push(kk);
  });
  IMP=res;
  box.innerHTML=`<div class="row" style="margin-bottom:8px">
      <span class="pill live">新增卡片 ${res.add.length}</span><span class="pill stale">跳過（已存在）${res.skip.length}</span>
      ${res.kAdd.length||res.kSkip.length?`<span class="pill live">新增合約 ${res.kAdd.length}</span><span class="pill stale">跳過合約 ${res.kSkip.length}</span>`:''}
      ${res.err.length?`<span class="pill" style="border-color:#E5B1B1;color:#A12F2F;background:#FDECEC">錯誤 ${res.err.length}</span>`:''}
    </div>
    ${res.err.map(e=>`<div class="warnbox">第 ${esc(e.i)} 筆：${esc(e.msg)}</div>`).join('')}
    <table class="list"><thead><tr><th>結果</th><th>類型</th><th>標題</th><th>截止日</th><th>來源ID</th></tr></thead><tbody>
      ${res.add.map(({c,warn})=>`<tr><td><span class="st done">新增</span></td><td><span class="tag T-${esc(c['卡片類型'])}">${esc(c['卡片類型'])}</span></td><td>${esc(c['標題'])}${warn.length?`<div class="unsaved">${esc(warn.join('；'))}</div>`:''}</td><td class="mono">${esc(c['截止日'])}</td><td class="mono muted">${esc(c['來源ID'])}</td></tr>`).join('')}
      ${res.skip.map(c=>`<tr style="opacity:.6"><td><span class="st wait">跳過</span></td><td>${esc(c['卡片類型'])}</td><td>${esc(c['標題'])}</td><td class="mono">${esc(c['截止日'])}</td><td class="mono muted">${esc(c['來源ID'])}</td></tr>`).join('')}
      ${res.kAdd.map(k=>`<tr><td><span class="st done">新增合約</span></td><td>合約</td><td>${esc(k['合約名稱'])}</td><td class="mono">${esc(k['迄日'])}</td><td class="mono muted">${esc(k['合約ID'])}</td></tr>`).join('')}
    </tbody></table>
    <div class="row" style="margin-top:10px"><span class="sp"></span><button class="primary" id="impGo" ${res.add.length||res.kAdd.length?'':'disabled'}>確認匯入</button></div>`;
  const go=$('#impGo'); if(go) go.onclick=doImport;
}
async function doImport(){
  if(!IMP) return; const rows=IMP.add.map(x=>x.c), ks=IMP.kAdd;
  S.Cards.push(...rows);
  if(rows.length) await persist('importCards',{rows});
  const n = 0;
  toast(`已匯入 ${rows.length} 張卡片${ks.length?`、${ks.length} 份合約`:''}${n?`，並產生 ${n} 張定期卡`:''}`);
  IMP=null; $('#impText').value=''; $('#impPrev').innerHTML=emptyX('imp','貼上 JSON 後按「檢查並預覽」',1);
}

function openSettings(){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="mask"><div class="modal" style="max-width:620px">
    <div class="row" style="margin-bottom:12px"><h2 style="margin:0">連線設定</h2><span class="sp"></span><button class="ghost" id="mClose">✕</button></div>
    ${live()?'':emptyX('conn','目前是示範模式，資料不會儲存',1)}
    <p class="muted" style="margin-top:0">網址與密碼只存在這台電腦的瀏覽器，不會出現在 GitHub 的程式碼裡。</p>
    <div class="form" style="grid-template-columns:1fr">
      <div><label>Apps Script 網頁應用程式網址</label><input id="sUrl" class="mono" value="${esc(ls.get(LS.url,''))}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div><label>通關密碼（與 Apps Script 的 TOKEN 相同）</label><input id="sTok" type="password" value="${esc(ls.get(LS.token,''))}"></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="danger" id="sClear">清除，回到示範模式</button><span class="sp"></span><button class="primary" id="sSave">儲存並連線</button></div>
  </div></div>`;
  $('#mClose').onclick=()=>root.innerHTML='';
  $('#sSave').onclick=()=>{ ls.set(LS.url,$('#sUrl').value.trim()); ls.set(LS.token,$('#sTok').value.trim()); root.innerHTML=''; loadAll(); };
  $('#sClear').onclick=()=>{ localStorage.removeItem(LS.url); localStorage.removeItem(LS.token); root.innerHTML=''; loadAll(); };
}

const MGMT_SYS = "# 系統角色與任務 (System Prompt)\n你現在是一位擁有 10 年以上經驗的金融核心系統「資深 IT 專案經理 (Technical PM)」。\n你的任務是將工程師或維運同仁記錄的技術碎雜進展、子任務清單及單號處理歷程（包含需求單與維修單），提煉並改寫為高階長官（處長、副理、科長層級）重視且具備決策價值的高品質週報表格。\n\n長官看週報的核心目的是：掌握進度、控管風險、分配資源，而非了解底層技術細節。\n\n## 核心轉換原則\n\n1. **以「專案主題 / 關聯單號」為核心聚合**\n   - 聚焦於整體業務目標（如：普發現金、網銀登入優化、補摺機換版等）。\n   - 將同一單號或主題下的多項瑣碎子任務，整合成連貫的進展段落，嚴禁拆成多個瑣碎的 Task 分散報告。\n\n2. **將技術術語翻譯成「業務效益與營運穩定度」 (講人話)**\n   - 淡化底層程式碼、參數名稱或除錯細節。\n   - 轉換範例：\n     - 原始：「修改 XML timeout 從 3000ms 改為 5000ms」 -> 改寫：「優化讀取容錯機制，解決偶發交易失敗問題」。\n     - 原始：「DB 死鎖，下達強制重開指令」 -> 改寫：「排除資料庫壅塞異常，並優化系統重啟與自我檢測機制」。\n\n3. **排除無效雜訊**\n   - 過濾日常例行性登入查核、單純電話通知等無決策價值的瑣事，僅呈現具里程碑性質或影響專案進度的成果。\n\n## 針對不同單據的專屬撰寫重點\n\n請根據輸入的單據類型，在內容中突顯以下管理面向：\n\n**A. 需求單 (Requirements / 新功能增修) —— 重點：交付承諾與資源協調**\n- **當前階段與里程碑：** 目前處於需求釐清、開發、SIT、UAT 或準備派版階段？本週達成了哪個關鍵節點？\n- **跨單位協作與潛在風險：** 是否有需要長官出面協調的阻礙？（如：等待企劃確認規格、催促廠商交付派版包）。\n- **預期時程 (ETA)：** 必須明確指出預計測試、驗收或上線的時間點。\n\n**B. 維修單 (Maintenance / 故障或 Bug 排除) —— 重點：災情控制與系統穩定度**\n- **處置進度與狀態：** 目前是「已提供暫時替代方案 (Workaround)」、「查修中」還是「已徹底修復」？\n- **影響範圍與業務衝擊：** 實際影響了什麼？（如：約 50 筆帳務受影響、某設備無法連線）。\n- **根本原因與預防措施 (RCA)：** 用非技術語言簡述發生原因，並強調查修後的「預防作為」（如：移至離峰時段執行、增設自動告警機制）。\n\n## 輸出格式規範\n\n每次輸出時，請嚴格依照以下 Markdown 表格格式，不可隨意更改欄位名稱。\n表格內容若需換行，請一律使用 `<br>`。\n\n| 項目 (單號/主題) | 本週處理重要進度與工作事項 | 備註 (狀態/時程) |\n| :--- | :--- | :--- |\n| **【單號】專案或異常主題** | **1. [事項標題一]**<br>[進展說明、風險與預計推展或預防措施]<br>**2. [事項標題二]**<br>[進展說明] | 預計 [上線/修復] 時間：[日期]<br>負責人：[姓名] |\n\n## 範例對照\n\n**【原始輸入範例】**\n[RQ10063] 補摺機軟體功能增修 (負責人: 王大明)\n- 每天看 log 沒事\n- 改了磁條讀取 timeout 參數，退本問題解決了，LAB 測試沒卡紙\n- 催廠商下週二交程式\n\n**【Claude 輸出範例】**\n| 項目 (單號/主題) | 本週處理重要進度與工作事項 | 備註 (狀態/時程) |\n| :--- | :--- | :--- |\n| **【RQ10063】補摺機軟體功能增修** | **1. 磁條讀取容錯機制優化**<br>已完成優化，有效降低客戶偶發退本率；實驗室壓力測試運作穩定。<br>**2. 軟硬體整合測試與派版**<br>進度正常，已督促廠商依限於下週二交付正式程式，隨後排入試點。 | 預計 11/15 驗收<br>負責人：王大明 |";

const TICKET_STATUS={'開立':'查修中','已通知廠商':'查修中','廠商處理中':'查修中','觀察期':'觀察期','結案':'已徹底修復'};
function ivDefaults(c,kind){

const ivFilled = v => Array.isArray(v) ? v.length>0 : String(v||'').trim()!=='';
/** 把選單答案轉成要給 AI 的條列；k = prog/risk/next */
function ivLines(kind,iv){
  const o=[], add=(k,t)=>{ if(t) o.push({k,t}); };
  const j=(a,b,s='')=>[a,b].filter(ivFilled).map(x=>Array.isArray(x)?x.join('、'):x).join(s||'；');
  if(kind==='project'){
    add('prog',iv.stage&&`目前階段：${iv.stage}`);
    add('prog',j(iv.miles,iv.miles_o)&&`本週關鍵節點：${j(iv.miles,iv.miles_o)}`);
    add('risk',iv.block&&`需協調／阻礙：${iv.block}${iv.block_d?'（'+iv.block_d+'）':''}`);
    add('next',(iv.eta_k||iv.eta_d)&&`預期時程：${iv.eta_k||'預計'} ${iv.eta_d||'（日期未定）'}`);
  }else if(kind==='ticket'){
    add('prog',iv.status&&`處置狀態：${iv.status}`);
    add('prog',(iv.scope||iv.cnt)&&`影響範圍：${[iv.scope,iv.cnt&&'（'+iv.cnt+'）'].filter(Boolean).join('')}`);
    add('prog',iv.impact&&`業務衝擊：${iv.impact}`);
    add('prog',(iv.rca||iv.rca_d)&&`根本原因：${[iv.rca,iv.rca_d].filter(Boolean).join('；')}`);
    add('next',j(iv.prev,iv.prev_o)&&`預防作為：${j(iv.prev,iv.prev_o)}`);
    add('next',(iv.eta_k||iv.eta_d)&&`預期時程：${iv.eta_k||'預計'} ${iv.eta_d||'（日期未定）'}`);
  }
  return o;
}
const ivTypeLabel = c => c['卡片類型']==='維修單'?'維修單':(c['卡片類型']==='資安專案'?'需求單（資安專案）':(c['卡片類型']==='專案'?'需求單（專案）':c['卡片類型']));
function ivBlock(c,kind,iv,raw){

function mgmtPrompt(blocks){
  return `${MGMT_SYS}\n\n---\n\n## 本次輸入資料\n以下是本週的單據資料。「訪談結果」是承辦人以選單確認的事實，「原始紀錄」是承辦人的雜亂筆記，請依上面的規則改寫。\n\n${blocks.join('\n\n')}\n\n---\n\n## 輸出要求\n- 只輸出一個 Markdown 表格（含表頭），每個「單號／主題」一列；同一單號的多項事項整合在同列內，並以 <br> 換行。\n- 不得新增輸入資料中沒有的事實、日期、數字或人名；缺資料的面向直接省略，不要臆測。\n- 單號、機台代碼、廠商名稱、專有名詞原樣保留。\n- 備註欄需包含狀態、預計時間與負責人。\n- 不要輸出表格以外的任何說明文字。`;
}
const progText = p => !p?'':[p['本週進展'],p['風險與協同']&&('風險與協同：'+p['風險與協同']),p['下週預計']&&('下週預計：'+p['下週預計'])].filter(x=>x&&String(x).trim()).join('\n');
function mgmtItems(wk){
  const done=[], todo=[];
  poolIds(wk).forEach(id=>{
    const c=cardById(id), kind=ivKind(c), iv=Object.assign({},ivDefaults(c,kind),ivStore.get(`${wk}|${id}`));
    const raw=progText(progOf(wk,id)), answered=ivLines(kind,ivStore.get(`${wk}|${id}`)).length>0;
    if(!answered && !String(raw).trim()){ todo.push(c['標題']); return; }
    done.push({id,c,answered,block:ivBlock(c,kind,iv,raw)});
    if(!answered) todo.push(c['標題']);
  });
  return {done,todo};
}
function mdTableHtml(t){
  const rows=String(t||'').split('\n').map(s=>s.trim()).filter(s=>s.startsWith('|'));
  if(rows.length<2) return '';
  const cells=l=>l.replace(/^\|/,'').replace(/\|$/,'').split('|').map(x=>x.trim());
  const fmt=s=>esc(s).replace(/&lt;br\s*\/?&gt;/gi,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const head=cells(rows[0]), body=rows.slice(1).filter(r=>!/^\|?\s*:?-{2,}/.test(r)).map(cells);
  return `<div style="overflow-x:auto"><table class="mgt"><thead><tr>${head.map(h=>`<th>${fmt(h)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(x=>`<td>${fmt(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function openInterview(id){
  const wk=CUR_WEEK, c=cardById(id), kind=ivKind(c), flow=IV_FLOW[kind]; if(!flow) return;
  const k=`${wk}|${id}`, iv=Object.assign({},ivDefaults(c,kind),ivStore.get(k)); let step=0;
  const root=$('#modalRoot'), close=()=>{ root.innerHTML=''; renderPool(); };
  const ensureDraft=()=>{ const p=progOf(wk,id)||{}; draft[k]=draft[k]||{狀態:p['狀態']||c['狀態'],本週進展:p['本週進展']||'',風險與協同:p['風險與協同']||'',下週預計:p['下週預計']||''}; return draft[k]; };
  const raw=()=>{ const d=draft[k], p=progOf(wk,id)||{}; return d?d['本週進展']:(p['本週進展']||''); };
  const rawAll=()=>{ const d=draft[k]; return d?progText(d):progText(progOf(wk,id)); };
  const answered=q=>q.fields.some(f=>f.type==='raw'?String(raw()).trim()!=='':ivFilled(iv[f.id]));
  const fieldHtml=f=>{ const v=iv[f.id];

    if(f.type==='chips') return `<div class="chips">${f.opts.map(o=>`<button type="button" class="chip ${(v||[]).includes(o)?'on':''}" data-chip="${f.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    if(f.type==='text') return `<input data-ivf="${f.id}" placeholder="${esc(f.ph||'')}" value="${esc(v||'')}">`;
    if(f.type==='date') return `<input type="date" data-ivf="${f.id}" value="${esc(v||'')}">`;
    if(f.type==='raw') return `<textarea rows="9" data-ivraw placeholder="${esc(f.ph||'')}">${esc(raw())}</textarea>`;
    return ''; };
  const prompt=()=>mgmtPrompt([ivBlock(c,kind,iv,rawAll())]);
  const sumHtml=()=>{ const L=ivLines(kind,iv); return L.length?L.map(x=>`<li>${esc(x.t)}</li>`).join(''):'<li class="muted">還沒有回答，從左邊開始選。</li>'; };
  const draw=()=>{
    const q=flow[step], n=flow.length;
    root.innerHTML=`<div class="mask"><div class="modal iv-modal">
      <div class="row" style="margin-bottom:12px"><div><div class="eyebrow">INTERVIEW ・ ${kind==='ticket'?'維修單':'需求單'}</div><h2 style="margin:4px 0 0;font-size:20px">${esc(c['標題'])}</h2><div class="muted mono" style="font-size:13px">${esc(c['關聯單號']||'')}${c['廠商']?' ・ '+esc(shortVendor(c['廠商'])):''} ・ ${esc(wk)}</div></div><span class="sp"></span><button class="ghost" id="ivClose">✕</button></div>
      <div class="iv-grid">
        <div class="iv-left">
          <div class="iv-steps">${flow.map((x,i)=>`<button type="button" data-step="${i}" class="${i===step?'on':''} ${answered(x)?'done':''}" title="${esc(x.q)}">${i+1}</button>`).join('')}</div>
          <div class="iv-q"><span class="iv-n">Q${step+1} / ${n}</span><h3>${esc(q.q)}</h3><p class="muted" style="margin:0">${esc(q.hint)}</p>
            <div class="iv-fields">${q.fields.map(fieldHtml).join('')}</div></div>
          <div class="iv-nav"><button id="ivPrev" ${step===0?'disabled':''}>上一題</button><span class="sp"></span>${step<n-1?'<button class="primary" id="ivNext">下一題</button>':'<button class="primary" id="ivDone">完成</button>'}</div>
        </div>
        <div class="iv-right">
          <div class="label">目前訪談摘要</div>
          <ul class="iv-sum" id="ivSum">${sumHtml()}</ul>
          <label class="label" for="ivPrompt" style="margin-top:12px;display:block">管理層週報 prompt（即時更新）</label>
          <textarea id="ivPrompt" readonly></textarea>
          <div class="row" style="margin-top:9px;flex-wrap:wrap"><button class="primary" id="ivCopy">複製 prompt</button><a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">前往 Gemini ↗</a><a href="https://claude.ai/" target="_blank" rel="noopener noreferrer">前往 Claude ↗</a><span class="sp"></span><button id="ivApply" title="把阻礙／時程寫進『風險與協同』『下週預計』（只補空白），並儲存本週進展">套用到卡片並儲存</button></div>
          <div class="muted" style="font-size:13px;margin-top:8px">選單答案只存在這台電腦的瀏覽器；原始紀錄就是卡片的「本週進展」。</div>
        </div></div></div></div>`;
    sync();
  };
  const sync=()=>{ const p=$('#ivPrompt'); if(p){ p.value=prompt(); p.scrollTop=p.scrollHeight; } const s=$('#ivSum'); if(s) s.innerHTML=sumHtml();
    $$('.iv-steps button').forEach((b,i)=>b.classList.toggle('done',answered(flow[i]))); };
  root.onclick=async e=>{
    const t=e.target;
    if(t.closest('#ivClose')||t.closest('#ivDone')){ close(); return; }
    if(t.classList&&t.classList.contains('mask')){ close(); return; }
    const st=t.closest('[data-step]'); if(st){ step=+st.dataset.step; draw(); return; }

    const ch=t.closest('[data-chip]'); if(ch){ const f=ch.dataset.chip, v=ch.dataset.v; const a=new Set(iv[f]||[]); a.has(v)?a.delete(v):a.add(v); iv[f]=[...a]; ch.classList.toggle('on',a.has(v)); ivStore.set(k,iv); sync(); return; }

    if(t.closest('#ivApply')){
      const d=ensureDraft(), L=ivLines(kind,iv), risk=L.filter(x=>x.k==='risk').map(x=>x.t).join('；'), next=L.filter(x=>x.k==='next').map(x=>x.t).join('；');

      if(next&&!String(d['下週預計']).trim()) d['下週預計']=next;
      if(!String(d['本週進展']).trim()){ toast('請先在最後一題填原始紀錄（本週進展必填）',true); return; }
      root.innerHTML=''; await saveProgress([id]);
    }
  };
  root.oninput=e=>{ const t=e.target;
    if(t.dataset.ivraw!==undefined){ ensureDraft()['本週進展']=t.value; sync(); return; }
    const f=t.dataset.ivf; if(f){ iv[f]=t.value; ivStore.set(k,iv); sync(); } };
  draw();
}
